name: validate

# Every gate, on every push and pull request, inside the development container (DDD-dec-81,
# items 2 and 3). scripts/ci.py is the single entry point; this workflow runs it and nothing
# else, so a local `python3 scripts/ci.py` in the devcontainer is the same pipeline.
#
# No secrets. The principle repository is public, so the pins gate clones the pinned ref
# anonymously, forks included. UPSTREAM_TOKEN is no longer read (P-12 of the ready-to-try
# session).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    name: pipeline (devcontainer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the release-head guard (DDD-dec-84) checks ancestry from a
          # descriptor's ratified_head, and skips descriptors whose tag already exists.
          fetch-depth: 0
      - uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/mindovermachine-dev/decision-driven-design-devcontainer
          push: never
          # canon (tools/canon/) runs beside scripts/ci.py, not in place of it (DDD-dec-102). From
          # Gate 2 it adds three checks no Python gate makes: its own tests, CHANGELOG.md as the
          # projection of releases/ (DDD-dec-104), and Refs #N with Basis: on canon commits over
          # the range under test (DDD-dec-105). GITHUB_BASE_REF is passed in so a pull request's
          # range is base..head.
          env: |
            GITHUB_BASE_REF
          runCmd: |
            set -e
            python3 scripts/ci.py
            # From tools/canon/, so its global.json (SDK band, test runner) applies.
            cd tools/canon
            dotnet test --project tests/Canon.Tests -c Release
            dotnet run --project src/Canon -c Release -- changelog --check
            dotnet run --project src/Canon -c Release -- issue-refs --basis
            # Gate 3: canon's graph gates (SHACL via Varve) beside scripts/ci.py's Python ones, and
            # the comparison of the two over every fixture and the live tree (DDD-dec-102). A
            # disagreement fails the run; it is recorded in tools/canon/parallel-run.md and fixed.
            dotnet run --project src/Canon -c Release -- check --compare
