name: validate

on:
  push:
    paths:
      - 'core/**'
      - 'graph/**'
      - 'apparatus/**'
      - 'applications/**'
  pull_request:
    paths:
      - 'core/**'
      - 'graph/**'
      - 'apparatus/**'
      - 'applications/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pyyaml
      - name: Local claims + decisions schema
        run: |
          python3 scripts/validate-claims.py core/claims/
          python3 scripts/validate-claims.py core/decisions/ --decisions
      - name: Upstream pins (E12/E13/W5) against the pinned ref
        # The principle repository is public, so the pinned ref clones without credentials and this
        # step runs everywhere, forks included. UPSTREAM_TOKEN is used when it is set (to lift the
        # anonymous rate limit) and is not required.
        env:
          UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          if [ -n "$UPSTREAM_TOKEN" ]; then
            git config --global url."https://x-access-token:${UPSTREAM_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          python3 validate-core-order.py core/
