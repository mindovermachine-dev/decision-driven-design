# THROWAWAY (#83, allowed by Emil at G1, meta/sessions/2026-11-18-canon-lock-file/rulings.md).
# Shows that canon builds with the agent review job's build steps on a GitHub runner, before the
# fix lands: agent-review.yml runs from main (pull_request_target) and builds main's canon, so
# it cannot show this branch's fix. This file is removed in its own commit before the head to
# ratify. Push to this branch only; read-only; no secrets; no check named `agent review`.

name: agent review build proof (throwaway, #83)

on:
  push:
    branches: [claude/canon-lock-file-2026-11-18]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build:
    name: build proof (throwaway)
    runs-on: ubuntu-latest
    steps:
      # As agent-review.yml's steps, with this branch's head checked out in place of main.
      - name: Checkout this branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: tools/canon/global.json

      # The build agent review's `dotnet run ... -c Release` does, in locked mode (CI is set on
      # the runner), without running `agent-review`, which needs the gates App's token.
      - name: Build canon as agent review does
        working-directory: tools/canon
        run: |
          echo "CI=$CI"
          dotnet --version
          dotnet build src/Canon -c Release
