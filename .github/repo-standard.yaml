# repo-standard declaration for mindovermachine-dev/decision-driven-design
#
# The repository's settings, declared (DDD-dec-81; the rulesets protecting main, DDD-dec-108;
# agent review, DDD-dec-109; the Signed Commits bypass, DDD-dec-110). Written for the
# `repo-standard` tool Varve uses, in the shape its `export` writes (Hafeok/varve,
# .github/repo-standard.yaml). Removing a top-level key stops that kind of resource being managed.
#
# Applying this file needs repository admin, which is Emil's act. Emil applied it on 2026-11-03
# (GOVERNANCE.md, "Repository settings"; meta/sessions/2026-11-03-protect-main/landing.md). The `agent review`
# check and the Signed Commits bypass below are NOT YET APPLIED: they wait for the gates App, its
# environment and secrets, and a re-apply, in that order (the same session's successor items).
#
# Only what DDD-dec-81, DDD-dec-108, DDD-dec-109 and DDD-dec-110 rule is changed from the settings
# at 2026-11-02. Issues, projects and the wiki stay as they were (all on). Labels, environments,
# secrets and Actions settings are left out, so they are not managed here. Environments stay out
# on purpose: a declared kind is managed exhaustively, and the `gates` environment is created by
# hand (DDD-dec-109's notes). Projects (the two boards) are not managed here either.
repository:
  # The description and topics were confirmed by Emil in Round 3 of the ready-to-try session.
  description: "Decision-Driven Design for software: the method, its claim graph and its decisions. Ready to try (preview)."
  homepage: ""
  topics:
  - decision-driven-design
  - software-design
  - specification
  - claim-graph
  - ai-agents
  default_branch: main
  features:
    issues: true
    projects: true
    wiki: true
    discussions: true
rulesets:
# main requires signed commits (item 8). One bypass actor (DDD-dec-110):
#   RepositoryRole 5     the admin role, Emil's.
# Integration 1236702, the Claude GitHub App, was a second bypass copied from Varve, for cloud
# sessions whose sandbox key is registered to nobody. Sessions here sign with a registered key, and
# Emil ruled it removed (DDD-dec-110).
# Merge commits made by GitHub are signed by GitHub and need no bypass.
- name: Signed Commits
  target: branch
  enforcement: active
  conditions:
    ref_name:
      exclude: []
      include:
      - ~DEFAULT_BRANCH
  rules:
  - type: required_signatures
  bypass_actors:
  - actor_id: 5
    actor_type: RepositoryRole
    bypass_mode: always
# trunk: what reaches main has passed its checks (DDD-dec-108, DDD-dec-109). A commit reaches main
# only by a fast-forward to a commit whose `pipeline (devcontainer)` and `agent review` checks have
# succeeded. Emil comments `approve <head sha>` on the pull request, then `canon land <pr>`
# pushes it to land/<name>, CI runs there, and `canon land <pr> --main` fast-forwards main to it
# (DDD-dec-101). No bypass, the admin role included.
- name: trunk
  target: branch
  enforcement: active
  conditions:
    ref_name:
      exclude: []
      include:
      - ~DEFAULT_BRANCH
  rules:
  - type: deletion
  - type: non_fast_forward
  - type: required_status_checks
    parameters:
      strict_required_status_checks_policy: false
      do_not_enforce_on_create: false
      # The one job of .github/workflows/validate.yml, by its job name. Renaming the job means
      # renaming it here in the same change, or nothing can land.
      required_status_checks:
      - context: pipeline (devcontainer)
        # GitHub Actions (github-actions), read from the check runs on main's head 5ccdf41: only
        # its check run counts, so no other app can satisfy the check under the same name.
        integration_id: 15368
      # Emil's approval of the head (DDD-dec-109), posted by .github/workflows/agent-review.yml
      # as the gates App: "mom-gates", owned by mindovermachine-dev, integration id 5594102
      # (Round 3 of the protect-main session; it replaced Varve's 5220446, which is not this
      # organisation's). canon land reads this pin from main's copy of this file, and refuses a
      # head without that App's green run.
      - context: agent review
        integration_id: 5594102
  bypass_actors: []
# land/** is where a commit gets its check before main is fast-forwarded to it (DDD-dec-108):
# only Emil creates, moves or deletes a land/ branch. User 2194785 is Emil's account (Hafeok),
# read from the author of main's head 5ccdf41.
- name: land
  target: branch
  enforcement: active
  conditions:
    ref_name:
      exclude: []
      include:
      - refs/heads/land/**
  rules:
  - type: creation
  # Declared with its parameter, as GitHub's export writes it, so a whole-ruleset comparison does
  # not read it as drift (as Varve).
  - type: update
    parameters:
      update_allows_fetch_and_merge: false
  - type: deletion
  - type: non_fast_forward
  bypass_actors:
  - actor_id: 2194785
    actor_type: User
    bypass_mode: always
# v* tags name releases cut under the release-head guard (DDD-dec-84): creating, deleting or
# force-moving one is restricted to Emil (DDD-dec-108). There is no gates App here, unlike Varve.
- name: Release Tags
  target: tag
  enforcement: active
  conditions:
    ref_name:
      exclude: []
      include:
      - refs/tags/v*
  rules:
  - type: creation
  - type: deletion
  - type: non_fast_forward
  bypass_actors:
  - actor_id: 2194785
    actor_type: User
    bypass_mode: always
