# decisions naming DDD-dec-09, -15, -17, -26, -37, -39 and term:presumed-discharge) all resolve
# now, through the seven pins added to graph/upstream.yaml at v5.15.2. The list as recorded is in
# history at the commit that added this file. It stays, empty, because DDD-dec-111 names it; the
# rule now has no exceptions.
entries: []
