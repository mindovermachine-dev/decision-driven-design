# graph/upstream.yaml — cross-repo dependency pins (DDD-agent-01 applied to repositories)
#
# decision-driven-design depends on the actor-indexed-determination principle repo; never the
# reverse. Every dependency is pinned at version AND status. The checker in
# validate-core-order.py resolves these against the pinned ref (a shallow clone into a temp dir)
# and raises:
#   E12  a pinned id no longer exists upstream at ref
#   E13  upstream canonical_md at ref differs from what a DDD doc embeds (only for embedded ids)
#   W5   an upstream claim's status changed since status_at_pin — an escaped decision until the
#        pin is consciously advanced (a governed decision, not a mechanical bump)
#
# Advancing a pin is a decision: when a pinned status has moved, record the advance as a decision
# under core/decisions/ before bumping status_at_pin.

format: upstream/v1
