# Index of the information set "product-definition".
#
# The index model is ACCEPTED (Emil, 2026-11-12, issue #75):
#   - the index is the boundary: a file belongs to the set because it is listed here;
#   - the boundary and the term homes are authored; uses, layers, paths and hashes are computed;
#   - Git is the log; a content hash per file detects a stale index;
#   - a word is a term when a statement depends on its precise meaning here, and a newcomer's
#     ordinary reading would get it wrong.
#
# SUPERSEDED (Emil, 2026-11-12, later the same day): terms are not the centre and do not order
# the layers. Canon is the centre of the information being projected. A term must be available
# to the reader where they meet it, or in a separate list where they look it up.
# So the homes below are glossary sources. They are not a dependency graph.
#
# ACCEPTED (Emil, 2026-11-12):
#   - canon is the centre; projections (summaries, briefs, specs) are the layers around it,
#     each derived from canon and never the reverse;
#   - terms are not a layer; they are served to the reader, explained where met or looked up;
#   - the index is the boundary plus the glossary;
#   - product-definition.md is the canon right now. It is self-contained as the core of what
#     is to be projected;
#   - the `source` slot is retired. No separate <name>.source.md is authored;
#   - the canon will mostly be read and projected by models, and is labelled as such. The label
#     is the `reader` field on the canon member below. The canon file itself was not changed.
#
# The CONTENT below is PROPOSED (Claude, 2026-11-12) and awaits Emil's review: the boundary
# sentence, the choice of terms, and every home. A home names the section whose heading is given.
# Nothing in the member or imported files was changed to make this index.

set: product-definition
model: accepted
content: proposed
tracking: mindovermachine-dev/decision-driven-design#75

boundary: >-
