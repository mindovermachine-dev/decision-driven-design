    - C1
  - in: summary
    sentence: An agent proposes, and the author adopts or rejects each proposal.
    cites:
    - C1
  - in: summary
    sentence: The tool puts nothing in force; what the canonical document is held against, who accepts it and from which position it is in force belong to Writ.
