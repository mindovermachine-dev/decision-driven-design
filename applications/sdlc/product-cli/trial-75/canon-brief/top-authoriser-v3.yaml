headline: "product-cli: what a product does, made checkable"
document:
  summary: "The rewritten product-cli promises a machine-checkable statement of what a product does, with an executable oracle for its behaviour, exported as one graph that someone else can sign [C0, C1]. The tool puts nothing in force and decides nothing about realisation; acceptance and force belong to Writ [C1]. An agent writes only proposals, and nothing an agent wrote is in the What unless a person adopted it [C2, C5]."
chapters:
  C1:
    summary: "The What is authored in conversation, where an agent proposes and the author adopts or rejects, and its behaviour is executable before code exists [C1]."
  C2:
    summary: "The tool serves an author who adopts or rejects the agent's proposals, an agent who writes only proposals, and a realiser who needs an oracle to realise against [C2]."
  C3:
    summary: "Every agent write is a proposal that the author adopts or rejects, and `accepted` means adopted into the author's draft, carrying no force, permission or grant [C3.3, C3.6]."
  C4:
    summary: "Every format is under a read-forever rule from the first release, and the tool's published profile states that no record of this system binds anyone [C4, C4.5]."
  C5:
    summary: "Each guarantee is a property test in a public suite, and the tool holds no key and puts nothing in force [C5]."
  C6:
    summary: null
  C7:
    summary: "The implementation may change without the product changing, and the order of work ends by retiring the Rust binary [C0, C7]."
  C8:
    summary: "The scope is the What alone, without the How, work units, features, releases or code generation, and the tool records decisions and never puts one in force [C8]."
  CX:
    summary: "Most cross-repository dependencies are met; still open are Writ landing canonical N-Quads as the What document and Writ's embedded log and `land` [CX]."
