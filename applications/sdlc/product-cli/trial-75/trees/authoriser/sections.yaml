P1:
  summary: "An agent proposes, the author adopts or rejects each proposal, and every element of the What traces to the person who adopted it."
  cites: [P1.1, P1.3, P1.6]
P2:
  summary: "Anything that cannot be stated as a node, an edge or a shape is not yet specified, and the tool says so rather than accepting it."
  cites: [P2.1, P2.2]
P3:
  summary: "A Decider and a Projector are simulated sound and complete against scenarios drawn from the flows, and the same scenarios later judge realised code."
  cites: [P3.1, P3.2]
P4:
  summary: "The tool records the author's decisions, which carry no force, and produces a canonical document; who accepts it and from which position it is in force belong to Writ."
  cites: [P4.1, P4.2, P4.3, P4.4]
W1:
  summary: "No change set that carries a violation enters the draft log, and a failed write leaves the log unchanged."
  cites: [W1.1, W1.2]
W2:
  summary: "A Decider's signature and a Projector's signature are computed from the graph, and an authored signature or logic that disagrees with the computed signature is refused."
  cites: [W2.1, W2.2, W2.3]
W3:
  summary: "Each coverage gap is a finding, never a silent pass."
  cites: [W3.0]
W4:
  summary: "Orphans are findings: every aggregate field, projected field and claim is used somewhere, and every Decider has a reachable rejection."
  cites: [W4.0, W4.1, W4.2, W4.3, W4.4]
W5:
  summary: "Each type-boundary breach is refused at write, not reported later."
  cites: [W5.0]
W6:
  summary: "Every Decider and Projector with scenarios is simulated sound and complete before an export is marked ready, and a What with a failing scenario exports but says so."
  cites: [W6.1, W6.2]
W7:
  summary: "Two exports of the same draft position are byte-identical on every platform, and every derived export is a deterministic function of the canonical graph and artefacts."
  cites: [W7.1, W7.3]
W8:
  summary: "Importing a canonical export yields a draft whose export is byte-identical to the input."
  cites: [W8.1]
W9:
  summary: "An agent session cannot author a node before the nodes it derives from exist, and the gate is the session transport, not advice in a prompt."
  cites: [W9.1, W9.2]
W10:
  summary: "The tool holds no key and no grant, puts nothing in force, writes to no log but its own draft log, and its exporters produce documents only."
  cites: [W10.1, W10.2, W10.4, W10.6]
W11:
  summary: "The draft log is a conformant system under `dpp/1`, and a Writ decision that lands the export reaches each author decision and each agent proposal."
  cites: [W11.1, W11.10]
W12:
  summary: "Every change at the head of the draft log is attached to a decision record whose `by` is the author, and a proposal never reaches the head on its own."
  cites: [W12.1, W12.3]
