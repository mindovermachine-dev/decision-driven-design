P1:
  summary: "An agent proposes, the author adopts or rejects each proposal, and each adoption is a `dpp/1` decision record with its reason."
  cites: [P1.1, P1.3, P1.4]
P2:
  summary: "Anything that cannot be stated as a node, an edge or a shape is not yet specified, and the tool says so rather than accepting it."
  cites: [P2.1, P2.2]
P3:
  summary: "A Decider and a Projector are simulated sound and complete against scenarios drawn from the flows; the same scenarios later judge realised code through a wire protocol the tool implements."
  cites: [P3.1, P3.2]
P4:
  summary: "The tool records the author's decisions over the What as `dpp/1` records, which carry no force by its profile, and produces a canonical document."
  cites: [P4.1, P4.2, P4.3]
W1:
  summary: "No change set carrying a violation enters the draft log, and a failed write leaves the log unchanged."
  cites: [W1.1, W1.2]
W2:
  summary: "Signatures of a Decider (commands, events, state) and a Projector (events, fields) are computed from the graph, and an authored signature or logic that disagrees with them is refused."
  cites: [W2.1, W2.2, W2.3]
W3:
  summary: "Each coverage gap is a finding, never a silent pass, across command handling, event folding, scenarios per (command, subject kind) pair, View scope rules and trigger subject kinds."
  cites: [W3.0, W3.1, W3.2, W3.3, W3.4, W3.5]
W4:
  summary: "Orphans are findings: every aggregate field is read by some Decider, every projected field consumed by some step, every claim read or compared, and every Decider has a reachable rejection."
  cites: [W4.0, W4.1, W4.2, W4.3, W4.4]
W5:
  summary: "Type-boundary breaches in UI steps, trigger subjects and journeys are refused at write, not reported later, an absent trigger subject is accepted, and a What without subjects exports byte-identically."
  cites: [W5.0, W5.1, W5.2, W5.3, W5.5, W5.6]
W6:
  summary: "Every Decider and Projector with scenarios is simulated sound and complete before an export is marked ready; a What with a failing scenario exports, saying so in its What-version record."
  cites: [W6.1, W6.2]
W7:
  summary: "Exports of one draft position are byte-identical on every platform, canonicalised once before any exporter runs; each derived export is deterministic and its record names the canonical graph's canonical hash."
  cites: [W7.1, W7.2, W7.3, W7.4]
W8:
  summary: "Importing a canonical export yields a draft whose export is byte-identical to the input, graph and artefacts."
  cites: [W8.1]
W9:
  summary: "An agent session cannot author a node before the nodes it derives from exist, and the gate is the session transport, not advice in a prompt."
  cites: [W9.1, W9.2]
W10:
  summary: "The tool holds no key and no grant, knows no Writ position, writes to no log but its own draft log, and its exporters produce documents only."
  cites: [W10.1, W10.3, W10.4, W10.6]
W11:
  summary: "The draft log conforms to `dpp/1` at specification 1.0, checked by its conformance suite; every exposed record has a non-empty `why` and `system` equal to the log's identifier."
  cites: [W11.1, W11.2, W11.4, W11.5]
W12:
  summary: "Every change at the head of the draft log is attached to a decision record whose `by` is the author, and the agent surface has no verb that adopts."
  cites: [W12.1, W12.4]
