CH1:
  summary: "Anything that cannot be stated as a node, an edge or a shape is not yet specified, and the tool says so rather than accepting it. A Decider and a Projector are simulated sound and complete against scenarios drawn from the flows, and the same scenarios later judge realised code through a wire protocol the tool implements. Each adoption of an agent's proposal by the author is a `dpp/1` decision record with its reason."
  cites: [P1, P2, P3]
CH5:
  summary: "Violations are refused at write and leave the draft log unchanged, as are authored signatures that disagree with the computed ones, while coverage gaps and orphans are findings. Exports of one draft position are byte-identical on every platform, and re-export after import is byte-identical to the input; simulation precedes an export being marked ready, and the session transport gates an agent session's authoring order. Every exposed record has a non-empty `why`."
  cites: [W0.4, W1, W2, W3, W4, W5, W6, W7, W8, W9, W11]
