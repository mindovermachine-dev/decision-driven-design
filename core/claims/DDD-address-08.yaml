format: 1
id: DDD-address-08
kind: normative
statement: |
  A process is a human understanding of work, scoped within an area of expertise and not an object of the model, and its translation into the model is a named view of an act map fixed by one or more norths — unresolved determinables, where demand originates — and optionally bounded by composite acts.
status: projected
region: |
  Wherever work that its holders call a process is mapped with the method. The view shows the
  act sites on a dependency path (DDD-address-01) from each north's entry act to the act where
  its determinate lands, inside the bound where one is given. It leaves out readings of earlier
  occurrences, so rank from north is strict. Its parts:

  - North. An unresolved determinable from the map's index (DDD-address-06): a cause. It exists
    whether or not governance has taken it up (DDD-frame-13; upstream core/00 §4a). It is not a
    decision and not an act. Time sets its rate of change, and that change is what creates
    demand, so work that starts on a calendar has a north like any other.
  - The other end. The act at which discharge produces the determinate (upstream core/09 §7a).
  - The bound. None, one or more composite acts (DDD-ground-06). People name a process by where
    the work happens and who holds it as well as by why it happens, and the model keeps those
    apart: the first is composite acts, the second is norths.

  A process is a saved view with a name. It is never a node of the map, and no decision is
  anchored to it. A view is not a second act map (DDD-address-07). The translation may cross
  composite acts.
evidence: []
falsifier: |
  A view that the holders of a process do not recognise as their process, or a process whose holders can name no determinable it answers once the calendar is set aside.
test: |
  Utility, on a second mapped case outside software: the holders of a process there are shown its view, and the claim fails on either limb. A process is settled inside one area of expertise, so the test is of use to its holders and not of fact.
breaks: |
  Step 1b's use of "a process" as its unit (method/01b-map-the-flow-of-demand.md), and the promotion condition of DDD-flow-01 to DDD-flow-04 ("a second process"), which would have no defined subject.
owner: none
changed: 2026-11-17, act map and process session (G2, on the G1 rulings; DDD-dec-122)
notes: |
  Ruled by Emil, 2026-11-17 (DDD-dec-122; rulings.md E-1, R-2, R-4, R-5, R-6 and R-7 point 4).

  Emil on the process (R-4): "A process is a simple human understanding og work being done, it
  is scoped and settled usually in a way that only makes sense within a given area of expertise.
  Software, finance, hr etc. What we have is a much more complex model of the world and mapping
  a process into our model is going to be hard. But I still think its the best translation of
  the concept we have". On north (E-4): "North cant be a decision it must be where the demand
  for decisions originate, so it is a cause."

  Corrections recorded in rulings.md, with attribution:
  - Claude first proposed "a process is a composite act". Withdrawn on E-2: the only name for a
    layer is composite act.
  - R-1 ruled north to be the discharge act of a declared demand kind. Superseded by R-2: north
    is the unresolved determinable, and the discharge act is the other end.
  - Claude then proposed north to be "a decision that must be made". Withdrawn on E-4: demand
    is over determinables, and a decision is a determinable governance has taken up.
  - Claude kept calendar-started work as a candidate process with no north. Withdrawn on E-5.

  What this leaves as filed:
  - DDD-dec-114's Round 9, "the SDLC is a subprocess under the PDLC", with its ruled reading, a
    composite act within the PDLC. "Subprocess" is software's own word for its work. Nothing is
    superseded. In this claim's terms the SDLC is a bound, with the norths whose determinates
    land at its discharge act.
  - The ruling made in Mantle's planning project on 2026-11-17, "a process is a composite act
    that holds acts directly", is a view with a bound and no north: a case of this claim.
    Whether Mantle keeps it is ruled there (O-9).

  UNVERIFIED — Emil review:
  - That a process may cross composite acts without the decomposition being wrong is Claude's
    reading of R-4.
  - Computed on the lifecycle map at 84aa466 (rulings.md, evidence): following dependencies
    back from each demand kind's discharge act, honouring lc:forKind and leaving out
    lc:readsEarlier, the chain ends at the kind's entry act (o0 for new, oC for owed, oG for
    own-ground). New demand also declares oC as an entry act, and no dependency leads from oC
    towards o16 for new demand (O-5). This was computed with the discharge act as north, before
    R-2, and shows that the path between the two ends is well defined on that map, not that
    the claim holds.
  - That time is the cause of determination rests on E-5 and R-6 and on no filed claim. The
    nearest text is the upstream holding note meta/holding-note-addendum-determinables.md, Q36,
    which is not ratified.
