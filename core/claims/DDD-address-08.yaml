format: 1
id: DDD-address-08
kind: normative
statement: |
  A process is a human understanding of work, scoped within an area of expertise and not an object of the model, and its translation into the model is a named view of one act map, fixed by one or more norths and optionally bounded by composite acts inside the map's scope, where a north is the determinable of a pull whether or not a gap is open on it now.
status: projected
region: |
  Wherever work that its holders call a process is mapped with the method. The view shows the
  act sites on a dependency path (DDD-address-01) from each north's entry act to the act where
  its determinate lands, both inside the map's scope (DDD-address-06), and inside the bound where
  one is given. It leaves out readings of earlier occurrences, so rank from north is strict. Its
  parts:

  - North. A determinable from the map's index: a cause, not a decision and not an act. It is
    the determinable of a pull (DDD-address-09) whether or not a gap is open on it now, so a
    process keeps its north between occurrences. The determinable is to the gap as the act site
    is to the occurrence. It is a north whether or not governance inside the scope has taken it
    up (DDD-frame-13; upstream core/00 §4a). A decision taken outside the scope is world to the
    map. Time sets its rate of change, and that change is what creates demand, so work that
    starts on a calendar has a north like any other.
  - The other end. The act at which discharge produces the determinate (upstream core/09 §7a).
  - The bound. None, one or more composite acts inside the scope (DDD-ground-06). People name a
    process by where the work happens and who holds it as well as by why it happens, and the
    model keeps those apart: the first is composite acts, the second is norths.

  A process is a saved view with a name. It is never a node of the map, and no decision is
  anchored to it. A view is not a second act map (DDD-address-07). The translation may cross
  composite acts.
evidence: []
falsifier: |
  A view that the holders of a process do not recognise as their process, or a process whose holders can name no determinable it answers once the calendar is set aside, or a process its holders recognise whose work answers no gap between any two states at any time.
test: |
  Utility, on a second mapped case outside software: the holders of a process there are shown its view, and the claim fails on any limb. A process is settled inside one area of expertise, so the test is of use to its holders and not of fact.
breaks: |
  Step 1b's use of "a process" as its unit (method/01b-map-the-flow-of-demand.md), the promotion condition of DDD-flow-01 to DDD-flow-04 ("a second process"), which would have no defined subject, and under the third limb the identification of north with a pull's determinable.
owner: none
changed: 2026-11-18, act map, scope and pull session (G2, on the G1 rulings; DDD-dec-122)
notes: |
  History. First drafted on 2026-11-17 on a branch that did not land
  (claude/act-map-and-process-2026-11-17; kept on claude/pull-and-scope-2026-11-18 at 47cf4cc),
  and amended on the rulings of 2026-11-18 (meta/sessions/2026-11-18-pull-and-scope/rulings.md,
  R-8). The 2026-11-17 statement fixed the view by "unresolved determinables". The amendment
  makes north the determinable of a pull, bounds the view inside the scope, and drops
  "unresolved" as a condition.

  Ruled by Emil: 2026-11-17 E-1, R-2, R-4, R-5, R-6 and R-7 point 4; 2026-11-18 R-2 and R-5;
  G1-Q3 with correction C-2, and K-1 (meta/sessions/2026-11-18-act-map-scope-and-pull/
  rulings.md).

  K-1, ruled 2026-11-18 13:26: C-2 supersedes the wording of 2026-11-17 R-2 ("North is the
  unresolved determinable") and of the matching line in issue #80's "ruled before" list ("North
  is an unresolved determinable, where demand originates"), not their meaning. A north is a cause
  and a determinable, as R-2 ruled. It rests on 2026-11-17 R-6: time sets a determinable's rate
  of change, which is what creates demand.

  Emil on the process (2026-11-17 R-4): "A process is a simple human understanding og work being
  done, it is scoped and settled usually in a way that only makes sense within a given area of
  expertise. Software, finance, hr etc. What we have is a much more complex model of the world
  and mapping a process into our model is going to be hard. But I still think its the best
  translation of the concept we have". On north (2026-11-17 E-4): "North cant be a decision it
  must be where the demand for decisions originate, so it is a cause."

  Corrections, recorded in the session rulings with attribution:
  - Claude first proposed "a process is a composite act". Withdrawn on 2026-11-17 E-2.
  - 2026-11-17 R-1 ruled north to be the discharge act of a declared demand kind. Superseded by
    R-2: north is the determinable, and the discharge act is the other end.
  - Claude proposed north to be "a decision that must be made". Withdrawn on 2026-11-17 E-4.
  - Claude kept calendar-started work as a candidate process with no north. Withdrawn on E-5.
  - Claude made "unresolved" a condition of north at G1 (P-3). Corrected by Emil (C-2).

  What this leaves as filed: DDD-dec-114's Round 9 reading of the SDLC as a composite act within
  the PDLC. In this claim's terms the SDLC is a bound, and in DDD-address-06's it may also be
  declared a scope. The ruling made in Mantle's planning project on 2026-11-17, "a process is a
  composite act that holds acts directly", is a view with a bound and no north. Whether Mantle
  keeps it is ruled there (O-9 of 2026-11-17).

  UNVERIFIED — Emil review: that a process may cross composite acts without the decomposition
  being wrong is Claude's reading of 2026-11-17 R-4.
