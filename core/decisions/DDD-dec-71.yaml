format: 1
id: DDD-dec-71
kind: decision
supersedes: DDD-dec-61
statement: |
  Generation is out of scope for the How. The old realisation declarations and code-generation seam are not carried forward. No vocabulary edition may be made check-only, so that generation stays additive.
principal: Emil
made: 2026-10-28, the Product Framework What move session, item 3 of its charter ("Supersede DDD-dec-55 to DDD-dec-61 with versions anchored to the real identifiers, per ruling 4 of 2026-10-28"), carrying out the obligation ruling 4 recorded on DDD-dec-61. The ruled content of DDD-dec-61 is carried unchanged; only its What identifiers are restated against the landed What (DDD-dec-63). Emil's acceptance of the pull request is the ratification act
resolution: |
  ## Carried from DDD-dec-61

  Everything DDD-dec-61 ruled, and everything it left standing as proposed until the merge,
  stands here unchanged. Read DDD-dec-61 for its rulings verbatim. DDD-dec-61 is left
  unchanged, and this decision supersedes it.

  ## Against the real identifiers

  - **No What identifier.** DDD-dec-61 named no What identifier. It is superseded only so that the
    supersession obligation it carried is discharged on the record, and its content is unchanged.

  ## The supersession obligation, discharged

  Ruling 4 of 2026-10-28: "when the What lands with its identity form, each is superseded by a
  version against the real identifiers, never edited". The What has landed (applications/sdlc/what.md)
  in the identity form of DDD-dec-63. The How examples' records that DDD-dec-61 bound are
  superseded by version 2 records (how-examples/README.md). No version 1 record was edited, and
  build.py refuses to rewrite a published version. The checker is green against the landed What.
  The examples remain a test product, and nothing in them is acceptable into a real product.
basedOn:
  - DDD-dec-61
  - DDD-dec-63
  - DDD-dec-54
notes: |
  Filed from the move session (meta/sessions/2026-10-28-product-framework-what-move/). Its id is
