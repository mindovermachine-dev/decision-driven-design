format: 1
id: DDD-dec-111
kind: decision
statement: |
  A decision's basedOn (or basis) must resolve. Each entry names a file under core/claims/ or core/decisions/, or an id pinned in graph/upstream.yaml. scripts/validate-claims.py --decisions and canon check gain the rule together, in one change and with fixtures, so the parallel run stays a comparison. An entry that resolves to nothing is an error. The entries found unresolved in decisions already filed are recorded unedited in graph/unresolved-basis.yaml, and report as warnings until Emil rules on them.
principal: Emil
made: |
  2026-11-03, given by Emil through the question dialog in the claude.ai conversation, answering S-20 of the canon CLI session, and recorded verbatim at meta/sessions/2026-11-02-canon-cli/rulings.md, Round 4 ("Yes, as its own decision (Recommended)", option text "A new decision; both validators gain the rule together, with fixtures, so the parallel run stays a comparison. Upstream ids resolve through graph/upstream.yaml"); Emil's landing of the branch is the ratification act
resolution: |
  ## The ruling

  > Q: "S-20: neither the Python validator nor canon checks that a decision's basedOn ids resolve
  > to an existing claim or decision; only that basedOn is present. A dangling basedOn is basis
  > loss the gate cannot see. Make resolution a rule?"
  >
  > A: "Yes, as its own decision (Recommended)" (option text: "A new decision; both validators
  > gain the rule together, with fixtures, so the parallel run stays a comparison. Upstream ids
  > resolve through graph/upstream.yaml")

  ## Why

  A decision rests on its basedOn edges (meta/graph-tool-ontology.md: decision --basedOn--> claim).
  An edge to an id that names nothing is basis loss: the decision cites ground that is not in the
  graph. The rule before this one checked only that the list is present. DDD-tool-01's discipline,
  and DDD-dec-105's for commits, is basis as query: the citation is checked against the live
  repository, not taken on the confidence of the prose.

  ## The rule

  For every entry of a decision's basedOn and basis lists, resolved against the live repository,
  as validate-releases.py resolves a release's basis:
  - a file stem under core/claims/ or core/decisions/; or
  - an id in graph/upstream.yaml's pins (upstream ids resolve through the pin file, as ruled); or
  - a term in core/graph/terms.yaml, this repository's own term registry (see notes).

  An entry that is none of these is an error (DEC-BASEDON-UNRESOLVED). A (decision, entry) pair
  recorded in graph/unresolved-basis.yaml is a warning (DEC-BASEDON-UNRESOLVED-RECORDED).

  ## The decisions already filed

  On 2026-11-03 the scan of all 86 filed decisions found 14 unresolved entries in 12 decisions:
  DDD-dec-11, -16, -18, -20, -23, -27, -28, -38, -40, -76, -82 and -84. Every entry names an id
  that exists in the principle repository at the pinned ref v5.15.2 and is not pinned here.
  Thirteen name upstream decisions (DDD-dec-09, -15, -17, -26, -37, -39) and one names an upstream
  term (term:presumed-discharge). None is edited. They are recorded in graph/unresolved-basis.yaml
  for Emil's ruling. Pinning the upstream ids would resolve them; the record only shrinks.
basedOn:
