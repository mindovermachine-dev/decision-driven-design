notes: |
  Id. Checked on 2026-11-03 at 09:16 UTC on every branch of both repositories. Upstream holds up to
  DDD-dec-39, and main holds up to DDD-dec-108. claude/sharp-davinci-89xeil, the protection
  session's agent-review round, holds DDD-dec-109 and DDD-dec-110 and has not landed. This is the
  next free id.

  Reading — Claude, UNVERIFIED — Emil review: the local term registry. The ruling names claims,
  decisions and the upstream pin file. A term in core/graph/terms.yaml is a local id of this
  repository, but neither a claim nor a decision. It is read as resolving. One entry depends on
  the reading: DDD-dec-21's term:maturation, a local term that shadows an upstream one. Without
  the reading, DDD-dec-21 would be a thirteenth failing decision.

  Reading — Claude, UNVERIFIED — Emil review: error with a record, not a warning.
  validate-claims.py's CHECK_CLASS policy makes a check an error only when its hit list against the
  corpus is empty. That would make this rule a warning, which no refuse fixture can test. Instead,
  the hit list is recorded in data (graph/unresolved-basis.yaml), the policy's "already migrated"
  case, so the rule is an error for every entry not recorded. A new dangling basedOn is refused
  from this decision on, and the old ones stay visible as warnings.
