notes: |
  Filed at the post-merge step of the Track 1 session and ratified by Emil's acceptance of the
  Track 1 pull request (#24, merge e96aa89, 2026-08-18). The [PROPOSED] banners in resolution and notes were struck
  2026-10-26 (DDD-dec-40).

  Numbering: decisions share one id space across the principle repo and this one. 26 was the
  upstream session decision, 27 this session's downstream decision, 28 this advance.

  ## The near-miss this advance produced, recorded because it is evidence

  The instruction to bump arrived once before the merge had happened. The tag did not exist,
  origin/main was unmoved, and upstream PR #15 was still open — verified by fetching tags and by
  querying the forge directly, because a stale local view was the alternative explanation and had
  to be excluded. The bump was not made, and the reason it was not made is worth keeping: a pin
  file naming a ref that does not exist is a false record, and a decision filed alongside it
  would have asserted an acceptance that had not occurred.

  What the instruments would have done is the asymmetry now recorded in Wave 3 successor item 2.
  A premature bump fails loudly — the clone cannot resolve the ref and E12 fires on every pin. A
  missed bump is silent, because W5 and W6 resolve against the ref the pin names and a superseded
  tag resolves cleanly. Detecting the silent direction needs the upstream tag list, an input no
  validator currently reads. The item stays Wave 3's, unscoped, and is not begun.
