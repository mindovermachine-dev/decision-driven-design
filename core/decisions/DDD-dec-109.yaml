notes: |
  Id. Checked on every branch of both repositories at 09:2x UTC on 2026-11-03, after main
  reached 320fccb. Upstream (27 branches) holds up to DDD-dec-39. Downstream, the highest
  decision file on any branch is DDD-dec-108, and no branch holds a file above it. The canon CLI
  session has ruled its S-20 decision (6ad604f) but not filed it. By Round 2 ("the next id above
  the highest held anywhere"), this round takes DDD-dec-109 and DDD-dec-110. The canon session
  had earlier been told 109 onward, so its S-20 decision takes the next free id at its own check.

  Ids read, not ruled. 2194785 is Emil's account (Hafeok), as in DDD-dec-108. 1236702 is the
  Claude app, read from performed_via_github_app on this repository's issues and comments
  (findings F-1). 5220446 is the gates App of Varve's .github/repo-standard.yaml. Emil is asked
  to confirm it is the same App, installable on this organisation, before the ruleset relies on
  it. Until then, the trunk ruleset's pin of "agent review" is declared, and it is not applied.

  Reading — Claude, UNVERIFIED — Emil review. "From a listed identity" is read as: a human of the
  map, by hand. A comment whose author is a listed human's login, made through the Claude app, is
  a session's and does not count. That is the ruled tamper case "a session-authored comment must
  not satisfy the check", and the only way to tell such a comment apart, because its login is
  Emil's.

  Reading — Claude, UNVERIFIED — Emil review. Rule 5 (an edited comment does not count) is not in
  Varve. It is added because a session can edit a comment of Emil's under his account, through
  the app, and the edit is not attributed. Whether GitHub moves updated_at for anything but an
  edit, such as a reaction, was not tested. If it does, an approval goes stale and Emil comments
  again, which fails safe.

  Reading — Claude, UNVERIFIED — Emil review. The gates environment holds the App's key, and it
  must be deployable from main only. A session can push any branch, with any workflow on it, so
  an environment open to land/** or to every branch would hand the key to a session. The
  environment is not declared in .github/repo-standard.yaml, because a declared kind is managed
  exhaustively and this session cannot read the repository's environments. Creating it is one of
  Emil's admin acts (the session record).

  Round 3, 2026-11-03, add-only; nothing above is edited. Emil confirmed all four of the ways
  this decision goes beyond Varve ("Accept all four (Recommended)", option text: "Each follows
  from sessions and you sharing one account"; meta/sessions/2026-11-03-protect-main/rulings.md):
  (1) every pull request needs the approval, not only one with a session's commits; (2) an
  edited approval comment does not count; (3) there is no land/** push trigger for the check;
  (4) the gates environment is not declared in .github/repo-standard.yaml. The readings above
  that flag (1), (2) and (4) as UNVERIFIED, and the resolution's own statement of (3), stand as
  ruled. The gates App is not Varve's 5220446. It is a new App owned by mindovermachine-dev,
  "mom-gates", with integration id 5594102 (Emil's check, Round 3; "New org-owned App
  (Recommended)", option text: "Create a 'gates' App owned by mindovermachine-dev (Checks: read &
  write, Pull requests: read). The session swaps the id before you land"). The trunk ruleset
  pins 5594102. Where the notes above name 5220446, read 5594102.
