notes: |
  Id. As DDD-dec-100's note: this session takes DDD-dec-100 onward.

  Not every Python checker is in scope for retirement. The dpp/1 reference implementation and
  the How examples, the papers' checkers and the primer generator stay Python, for reasons given
  in tools/canon/DESIGN.md §7. They are not validators of the claim and decision graph, and this
  ruling does not reach them.

  Reading — Claude, UNVERIFIED — Emil review. "Every fixture agrees" is read as a verdict match
  (accept or refuse) per fixture, not a match of message text. Rule codes are mapped one to one,
  so that a refuse fixture must also be refused for the same rule (DESIGN.md §8).

  Weakest point, stated where the ruling depends on it: Varve is a preview (0.1.0-preview.15 on
  nuget.org, published 2026-10-26, checked live on 2026-11-02). A gate that depends on it depends
  on a preview's API. The mitigation is in DESIGN.md §1.
