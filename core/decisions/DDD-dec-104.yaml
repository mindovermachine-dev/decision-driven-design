format: 1
id: DDD-dec-104
kind: decision
statement: |
  CHANGELOG.md is a projection of releases/*.yaml from v0.5.0 up. canon changelog writes it, and canon check fails when the file differs from the projection. The headings before v0.5.0 (the 4.x numbering, with tags v0.1.0 to v0.4.0) are a frozen tail, kept byte for byte and never regenerated. Release notes are written once, in the descriptor's summary, and reviewed in the pull request that proposes the release.
principal: Emil
made: |
  2026-11-02, Round 1 (the Gate 1 review) of the canon CLI session, given by Emil through the question dialog in the claude.ai conversation and recorded verbatim at meta/sessions/2026-11-02-canon-cli/rulings.md ("Yes, projection (Recommended)", option text "Release files are the source; the changelog is generated and checked for drift"); Emil's landing of the branch is the ratification act
resolution: |
  ## The ruling

  > Q: "Q-4: should CHANGELOG.md become a projection of releases/*.yaml from v0.5.0 up,
  > generated by canon changelog, with the 4.x headings frozen? It would also fix the stale
  > 'proposed, not cut' v0.5.0 section."
  >
  > A: "Yes, projection (Recommended)" (option text: "Release files are the source; the
  > changelog is generated and checked for drift")

  ## The projection

  - Source: every releases/*.yaml from v0.5.0 up, newest first by SemVer precedence. Each
    section is a heading from version and title, the date, whether it is cut, and the summary
    as written.
  - "Cut" means the version's tag exists, by the same test canon release uses: locally, on the
    remote, or as a GitHub Release (tools/canon/DESIGN.md §4.3). Offline, the local tag decides,
    and canon says so.
  - The frozen tail is everything in CHANGELOG.md from the first heading below v0.5.0 to the end,
    exactly as it stands at the commit that first writes the projection. canon checks it byte for
    byte against that commit's text, recorded by hash in canon.yaml.
  - canon changelog --check runs in canon check. It fails on any hand edit above the tail.

  ## What this fixes

  CHANGELOG.md at c7424ad still heads v0.5.0 "Ready to try (proposed)" and says "Proposed, not
  cut", though v0.5.0 is tagged at e5a332d. The first run of canon changelog rewrites that
  section from the descriptor.
basedOn:
  - DDD-dec-84
  - DDD-dec-82
  - DDD-dec-75
  - DDD-dec-101
notes: |
  Id. As DDD-dec-103's note.

  Reading — Claude, UNVERIFIED — Emil review. The v0.5.0 descriptor on main was changed after
  the tag (ratified_head moved from 4801fee to 02298d3 and then to 7aa3fb0, in 023c2c4 and
  c7424ad), so the descriptor no longer describes the commit that was tagged. The projection
  renders the descriptor as it is at the head. Whether the v0.5.0 descriptor is restored to its
  state at the tag is Emil's (successor item S-9). The projection does not decide it.

  Amendment, 2026-11-03 (add-only; the resolution above is not rewritten). Ruled by Emil in
  Round 2 of the canon CLI session, recorded verbatim at
  meta/sessions/2026-11-02-canon-cli/rulings.md ("Accept (Recommended)", option text "Record it
  as an add-only amendment to DDD-dec-104; its resolution text is not rewritten"). The
  projection does not render whether a version is cut. The resolution's line "whether it is
  cut" is superseded by this note. Rendering it would make CHANGELOG.md go stale whenever a tag
  is pushed, with no commit to show for it. Whether a version is cut stays a fact of the tags:
  the remote tags, as canon release and the releases gate ask them. A section renders the
  version, the title, the date, "pre-release" when the descriptor says so, the descriptor's
  path and its summary.
