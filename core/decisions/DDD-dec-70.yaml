format: 1
id: DDD-dec-70
kind: decision
supersedes: DDD-dec-60
statement: |
  The gate relies only on facts recorded with provenance, from Writ's closed provenance set, to which deployment-declared and deployment-observed are added as two values; a contract's violation description says which it requires. Facts that cite a What element cite its IRI in the identity form of DDD-dec-63. A fact no reporter could supply is a reported gap. A verdict that would need it is an open question, with the absent reporter as one candidate (G8). It is never 'unknown'.
principal: Emil
made: 2026-10-28, the Product Framework What move session, item 3 of its charter ("Supersede DDD-dec-55 to DDD-dec-61 with versions anchored to the real identifiers, per ruling 4 of 2026-10-28"), carrying out the obligation ruling 4 recorded on DDD-dec-60. The ruled content of DDD-dec-60 is carried unchanged; only its What identifiers are restated against the landed What (DDD-dec-63). Emil's acceptance of the pull request is the ratification act
resolution: |
  ## Carried from DDD-dec-60

  Everything DDD-dec-60 ruled, and everything it left standing as proposed until the merge,
  stands here unchanged. Read DDD-dec-60 for its rulings verbatim. DDD-dec-60 is left
  unchanged, and this decision supersedes it.

  ## Against the real identifiers

  - **Citations.** A code element's `sdlc:realises` names an element IRI, `P/what/<ULID>`. Readings
    r2 of the examples (`facts/*.r2.ttl`) do so, at the commits where the code was changed to cite
    the landed IRIs.
  - **RESID@1's factSources** already carry the ruled provenance values. RESID itself names no What
    identifier and is not superseded.

  ## The supersession obligation, discharged

  Ruling 4 of 2026-10-28: "when the What lands with its identity form, each is superseded by a
  version against the real identifiers, never edited". The What has landed (applications/sdlc/what.md)
  in the identity form of DDD-dec-63. The How examples' records that DDD-dec-60 bound are
  superseded by version 2 records (how-examples/README.md). No version 1 record was edited, and
  build.py refuses to rewrite a published version. The checker is green against the landed What.
  The examples remain a test product, and nothing in them is acceptable into a real product.
