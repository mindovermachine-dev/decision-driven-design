notes: |
  History. First drafted on 2026-11-17 on a branch that did not land
  (claude/act-map-and-process-2026-11-17; its commits kept on claude/pull-and-scope-2026-11-18 at
  47cf4cc), and amended on the rulings of 2026-11-18 (R-8) and of G1. The 2026-11-17 draft filed
  three claims and two method sentences. Neither sentence is filed here: the card changes replace
  them.

  Id. Checked on every branch of both repositories at arrival (08:51 UTC) and again before filing
  (12:26 UTC), 2026-11-18. DDD-dec-122 and DDD-address-06 to -08 appear only on the archive branch
  and the old branch. Nothing at DDD-address-09 or above exists anywhere. Upstream's highest
  decision is DDD-dec-39.

  Corrections, with attribution, in the session's rulings.md: Emil's C-1 and C-2 on Claude's
  proposals; Claude's catch of Emil's Q-9 reason against term:closure (K-2) and of his sentence
  for step 1's card against term:escape (K-3).

  Open, not ruled here: step 5 classifies closure before step 6 allocates the arrangement it is
  closed for (K-2). O-2 to O-5 and O-9 of 2026-11-17 stay open. Building the lifecycle's index of
  determinables, and which step builds it, are out of #80's scope.

  Review trigger. A second mapped case, outside software: its act map either fits DDD-address-06,
  its pulls the four states and its process the view of DDD-address-08, or not, and the six
  claims are reviewed with it.
