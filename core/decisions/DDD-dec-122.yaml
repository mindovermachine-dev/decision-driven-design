notes: |
  Id. Checked on every branch of both repositories at 15:40 UTC and again at 20:26 UTC,
  2026-11-17. The highest decision file on main is DDD-dec-118; DDD-dec-119 is on PR #73's
  branch, and DDD-dec-120 and -121 on PR #74's. Upstream's highest is DDD-dec-39. DDD-dec-122 and
  DDD-address-06 to -08 appear only in this session's records.

  No GitHub issue carries this work (R-7, point 7). The issue text is the session's prompt.md.

  The ruling made in Mantle's planning project on 2026-11-17, "a process is a composite act that
  holds acts directly", is not adopted as this repository's definition. DDD-address-08 reads it
  as a view with a bound and no north. Whether Mantle keeps it is ruled there.

  Not ruled, open for Emil (meta/sessions/2026-11-17-act-map-and-process/successor-items.md):
  O-1 to O-9, among them building the lifecycle's index of determinables (O-6) and which method
  step builds it (O-7).

  Readings — Claude, UNVERIFIED — Emil review: marked in each claim's notes and in rulings.md.

  Review trigger. A second mapped case, outside software: its act map either fits the four
  parts of DDD-address-06 and the view of DDD-address-08 or does not, and the three claims are
  reviewed with it.
