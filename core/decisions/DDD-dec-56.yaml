format: 1
id: DDD-dec-56
kind: decision
statement: |
  A package is a product with an empty What, a genesis, and a decision log. Its decision log is decision records only: constraints, bindings, contracts, vocabulary editions (which are decisions, naming the projector and reporter editions that implement them), and release records. The kinds it binds to are references in its decisions' anchors, not What elements of the package. Binaries are its realisation, referenced by digest. DDD-dec-46's 'its What is its decisions' is superseded; DDD-dec-42 stands.
principal: Emil
made: 2026-10-28, on the Product Framework How session's proposal (applications/sdlc/how.md at 88bf686, filed as a proposal on 2026-10-27); ruled in one message, recorded verbatim as Round 1 of meta/sessions/2026-10-27-product-framework-how/rulings.md; Emil's acceptance of the pull request is the ratification act, after the move's identity form lands and the supersessions of ruling 4 are written
resolution: |
  ## Ruled, 2026-10-28

  - **Ruling 2.** A package's What is empty. DDD-dec-46's "whose What is its decisions" is
    superseded by this decision. DDD-dec-46 is left unchanged, as DDD-dec-45 left DDD-dec-44.
    DDD-dec-42 ("a decision is not itself a What element") stands.
  - **Repair 3.** A package is one decision log, vocabulary editions included.

  See how.md §6.

  ## Provisional anchoring — the supersession obligation (ruling 4, 2026-10-28)

  > Decisions written before the identity form is fixed — accepted, provisionally. They live in
  > the test product only; they are not acceptable into any real product; and when the What lands
  > with its identity form, each is superseded by a version against the real identifiers, never
  > edited.

  Bound by it: every record in applications/sdlc/how-examples/ that anchors to a What element or
  names one (the target declarations, the imports, the acceptance), and the provisional What graph
  there. None may be imported, landed or accepted into any real product. When the What lands with
  its identity form, each is superseded by a new version against the real identifiers. No record
  is edited. This decision's own uses of provisional What kind names and identifiers are
  superseded the same way.
