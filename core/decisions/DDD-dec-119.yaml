format: 1
id: DDD-dec-119
kind: decision
statement: |
  The merge of PR #41 ratified every part of the How that was "not ruled separately" and stood as proposed until the merge. They are ruled as proposed: the parts listed under "Not ruled separately; stands as proposed until the merge" in DDD-dec-55, -57, -59 and -60, the condition on editions in DDD-dec-61, and every point applications/sdlc/how.md marked [PROPOSED] under its banner "what was not ruled separately stays [PROPOSED] until the merge", including Appendix A's H-3, H-8, H-9, H-11, H-12, H-13 and H-17 and the proposals it kept unlisted. It reaches applications/sdlc/how-vocabulary.md, the How's vocabulary under the same decisions, whose banner says "the rest stands as proposed until the merge". The ruling changes their register only, and no statement. It does not reach the [OPEN] point (whether adopters may register What kinds), any UNVERIFIED reading, or any document outside the How (how.md and how-vocabulary.md).
principal: Emil
made: |
  2026-11-10, in Claude's question dialog of the session meta/sessions/2026-11-09-applications-for-readers-redo/ (issue #71), answering PR #48's ruling request 2; recorded verbatim in that session's rulings.md, Round 2: "The merge ratified them all" (option text: "Every 'not ruled separately' item became ruled when #41 merged; the rewrite drops their [PROPOSED] marks"). Emil's landing of that session's branch is the ratification act
resolution: |
  ## The question

  how.md said, from 2026-10-28: "Sections a ruling settled say *Ruled*. What was not ruled
  separately stays [PROPOSED] until the merge." PR #41 merged (1d0f40c), although it was titled
  "for the record, not for merge", and how.md was not touched again except for dated pointers to
  the authority profile (533ac8e). PR #48's rewrite kept every such part marked unsettled and asked
  whether the merge had settled them (#48 report.md, ruling request 2). Two of them were already
  word for word in a decision's statement: coverage (DDD-dec-58) and the three parts of an import
  (DDD-dec-59).

  ## Ruled: the merge ratified them

  Each part below is ruled as it stood proposed at the merge. Locations are how.md on main at
  84aa466.

  | how.md | Part | Decision whose "not ruled separately" list held it |
  |---|---|---|
  | §4 | The three kinds; no fourth and no split; the idle report; target declarations and exclusions as record types; no-orphans as coverage of code by decisions | DDD-dec-55 |
  | §4.3 | A principle is not a kind | DDD-dec-55 |
  | §4.2, §9 | Kind-1 measurement wiring held as a contract; deployment-declared facts may gate land and deployment-observed facts do not; a freshness bound per contract | DDD-dec-60 |
  | §5, §5.2 | Every How decision stated once, with no language or platform term; shapes derived from a target's edition, never authored, and expressible iff the edition maps every fact term read; interface standards are not targets; platform targets beside languages; which targets the What declares and which How target declarations declare | DDD-dec-57 |
  | §5 | The form of a decision's statement and violation description | how.md's banner only |
  | §7 | The recorded-reading condition on "rests on superseded version"; narrow, never alter | DDD-dec-59 (its statement already ruled the three parts of an import and withdrawal) |
  | §8 | Coverage over every binding, as proposed | already ruled by DDD-dec-58's statement; how.md still marked it [PROPOSED] |
  | §10 | Generation out of scope, on condition that no edition may be check-only (H-15) | DDD-dec-61 |
  | §11 | Conformance: one level, specified and in force | how.md's banner only |
  | Appendix A | H-3, H-8, H-9, H-11, H-12, H-13, H-17; and "kept as proposed and not listed" | DDD-dec-55, -57, -59, -60 |

  ## Not reached

  - **[OPEN]:** whether adopters may register What kinds (how.md §6 and §10, item 2).
  - **UNVERIFIED readings:** the ratchet semantics of a baseline (§8.2), assumed while the
    authority profile was unwritten; Claude's reading of DDD-dec-45's consequence (§8.2); and the
    readings DDD-dec-55 to -61 record at filing under "UNVERIFIED — Emil review".
  - **Documents outside the How.** The ruling is about how.md, how-vocabulary.md and their
    decisions. The How vocabulary's IRI question (no IRI under /ns/sdlc is served; UNVERIFIED)
    is a reading, and is not reached either.
basedOn:
