notes: |
  The id is the next free one above DDD-dec-118, checked on every remote branch on 2026-11-10.
  The decisions it ratifies parts of are not edited. Each of them still says "stands as proposed
  until the merge", which this decision answers. The table above is Claude's inventory of the
  parts, checked against how.md at 84aa466. The §5 form and the §11 conformance level are in no
  decision's list and are reached only by how.md's banner. That reading is Claude's
  (UNVERIFIED — Emil review), and the rewrite of how.md marks them ruled on it.
