format: 1
id: DDD-dec-43
kind: decision
statement: |
  Tools never change the What; gathering What material from the tools and processes where parts of it already live is a valid use case; and everything gathered enters the What only when signed and approved by a human principal. This rules the Product Framework's authoring-scope profile (§14) for the moved What; the other three Preview profiles (§§11–13) are not ruled by it.
principal: Emil
made: 2026-10-27, the Product Framework What session; ruled in one message on the weakest point Claude named in its O-4 explanation ("we dont let tools change it, but we acknowledge that parts of the entire what lives else where and processes where we should be able to gather the information from those tools are a valid use case, but all must be signed and approved by a human principal"), recorded verbatim at meta/sessions/2026-10-27-product-framework-what/rulings.md; Emil's acceptance of the pull request is the ratification act
resolution: |
  ## The ruling

  1. **Tools do not change the What.** No tool is an author of the What in its own right. This
     follows from DDD-dec-42 (every change of the What is a decision anchored to a What element):
     a tool cannot be the principal of a decision.
  2. **Gathering is valid.** Parts of the What already live elsewhere — in tools (a Figma file, an
     Event Modeling board, a legacy schema) and in processes. Gathering What material from them is
     a valid, supported use case, not a workaround.
  3. **A human principal signs and approves everything.** Whatever is gathered enters the What
     only when signed and approved by a human principal. Unsigned or unapproved material is not
     part of the What.

  ## Claude's reading for the move — UNVERIFIED, Emil review

  - Product Framework §14's authoring scope survives as a **gathering scope**: which What element
    kinds a tool may supply material for, and which it must not. Its enforcement oracle still
    rejects out-of-scope material, and its completeness join still reports covered, coverable but
    ungathered, and uncovered kinds. What changes is the outcome of in-scope material: it becomes a
    proposed change awaiting a decision, not an accepted change.
  - Each approval is a decision anchored to the What element it changes, per DDD-dec-42, with the
    human principal as its principal. The tool is the source of the proposal; the human is the
    accountability terminus.
  - "Signed" is read as a verifiable seal over the approved content, not a click. The Decision
    Provenance Protocol (decprov/1) is the candidate mechanism; that link is not ruled.
