notes: |
  Filed from the Product Framework What session (meta/sessions/2026-10-27-product-framework-what/,
  arrival per DDD-dec-20). Recorded when given, before any move work, so the rulings stand in the
  repository before anything is built on them.

  Not done, and why: no Product Framework text is copied or rewritten here. Moving it before O-1
  to O-5 are ruled would make this repository a second, unruled copy of a standard that lives
  elsewhere, which is the two-sources-of-truth failure projections/README.md names.

