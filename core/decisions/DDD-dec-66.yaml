format: 1
id: DDD-dec-66
kind: decision
supersedes: DDD-dec-56
statement: |
  A package is a product with an empty What, a genesis, and a decision log. Its decision log is decision records only: constraints, bindings, contracts, vocabulary editions (which are decisions, naming the projector and reporter editions that implement them), and release records. The kinds it binds to are sdlc: kind IRIs of a named sdlc edition, carried in its decisions, not What elements of the package. Its product IRI is its anchor. Binaries are its realisation, referenced by digest. DDD-dec-46's 'its What is its decisions' stays superseded; DDD-dec-42 stands.
principal: Emil
made: 2026-10-28, the Product Framework What move session, item 3 of its charter ("Supersede DDD-dec-55 to DDD-dec-61 with versions anchored to the real identifiers, per ruling 4 of 2026-10-28"), carrying out the obligation ruling 4 recorded on DDD-dec-56. The ruled content of DDD-dec-56 is carried unchanged; only its What identifiers are restated against the landed What (DDD-dec-63). Emil's acceptance of the pull request is the ratification act
resolution: |
  ## Carried from DDD-dec-56

  Everything DDD-dec-56 ruled, and everything it left standing as proposed until the merge,
  stands here unchanged. Read DDD-dec-56 for its rulings verbatim. DDD-dec-56 is left
  unchanged, and this decision supersedes it.

  ## Against the real identifiers

  - **Kinds.** The kinds a package binds to are `sdlc:` IRIs of the landed ontology, for example
    `sdlc:Decider` and `sdlc:Command`. A package that binds a kind names the sdlc edition it means
    (`https://decision-driven-design.dk/ns/sdlc/1`).
  - **Anchors.** A package's decisions anchor to its product IRI (`https://vendor.example/packages/ref-arch`
    in the examples), which under DDD-dec-63 §1 is its product node in an empty What.

  ## The supersession obligation, discharged

  Ruling 4 of 2026-10-28: "when the What lands with its identity form, each is superseded by a
  version against the real identifiers, never edited". The What has landed (applications/sdlc/what.md)
  in the identity form of DDD-dec-63. The How examples' records that DDD-dec-56 bound are
  superseded by version 2 records (how-examples/README.md). No version 1 record was edited, and
  build.py refuses to rewrite a published version. The checker is green against the landed What.
  The examples remain a test product, and nothing in them is acceptable into a real product.
