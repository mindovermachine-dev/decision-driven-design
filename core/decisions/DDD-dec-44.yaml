notes: |
  Filed from the Product Framework What session, same pull request as DDD-dec-41..43, recorded
  when given. With this decision, every item DDD-dec-41 opened is ruled. What remains before the
  move session is chartered: the two open readings above (the §4.5/§4.6 rules, the genesis grant).

  Correction recorded with attribution: Claude's O-4 proposal classified §11 and §12 as How-side
  and recommended retiring them, and classified §13 as What-side and recommended moving it. Both
  classifications were wrong by Emil's ruling. Claude read "side" off which section each profile
  binds to; Emil reads it off what the implementation needs.
