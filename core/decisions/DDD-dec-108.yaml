notes: |
  Id. DDD-dec-108 was checked free on every branch of both repositories at arrival (2026-11-03,
  08:15 UTC): upstream holds up to DDD-dec-39 on its 27 branches, and no downstream branch of 48
  holds a decision above DDD-dec-107. The canon CLI session, running in parallel, takes
  DDD-dec-109 onward. Once this lands, its DESIGN.md §4.2 can cite this id (its S-8).

  Ids read, not ruled. The integration id 15368 is the app of the four "pipeline (devcontainer)"
  check runs on main's head 5ccdf41 (github-actions). The user id 2194785 is the GitHub author of
  5ccdf41 (Hafeok, Emil's account, the same id Varve's rulesets name for its maintainer).

  Reading — Claude, UNVERIFIED — Emil review. "land/**" in the option text names a pattern, not
  its rules. It is read as Varve's land ruleset: creation, update, deletion and non_fast_forward,
  with Emil the only bypass actor. "v* tags restricted to you" is read as Varve's tag ruleset
  without its gates App, which this repository does not have: creation, deletion and
  non_fast_forward, with Emil the only bypass actor. Pinning the required check to GitHub Actions
  by integration id is the session prompt's instruction, not the ruling's text; Varve pins only
  its "agent review" check. It means no other app can satisfy the check by posting a check run of
  the same name.

  Reading — Claude, UNVERIFIED — Emil review. "Refuses anything else" holds for main as far as
  the trunk ruleset reaches, and it does not reach two paths. It does not refuse a fast-forward
  of main, by someone with write access, to a commit already green on another branch, such as a
  session branch's head. It does not refuse a GitHub merge of a pull request whose check is
  green, which makes a merge commit. Varve names that merge as a second way in. Here canon land
  never merges, and the land/ path is the convention this decision names. Neither path is closed
  by the trunk ruleset alone.

  Found at filing, UNVERIFIED — Emil review. The repository's events show every push of the past
  ten days, cloud sessions' branches included, with Emil's account (Hafeok, 2194785) as the
  actor, not an app. If GitHub evaluates a ruleset's User bypass against that actor, a cloud
  session's push to land/** or of a v* tag would pass as Emil's, and "restricted to Emil" would
  not separate Emil from the sessions working under Emil. The session record
  (meta/sessions/2026-11-03-protect-main/) gives a check that settles it once the rulesets are
  applied.
