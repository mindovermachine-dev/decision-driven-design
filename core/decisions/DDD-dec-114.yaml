format: 1
id: DDD-dec-114
kind: decision
statement: |
  applications/pdlc/ is founded as the product lifecycle (the PDLC), with the SDLC as a composite act within it: every SDLC occurrence's layer path begins PDLC ▸ SDLC, and the seam between them is that composite act's boundary. The PDLC has three owners, each a scope under the product's genesis grant. The What owner owns the specification: everything the How needs in order to implement, as located declarations in the What, including the acceptance relation and tolerance, its observability needs (where in the product, and what data) and product assurance: how sure we can be that users do the act we designed, an assurance on the use act, because a product's success is allocated across the software and its users (Rounds 7, 17, 18, 19). The How owner owns implementation assurance, how sure we are that the feature is implemented correctly, an assurance on the How's acts (Round 19). The When owner is the business and the go-to-market owner: it owns the ordering of all new demand (Round 22), judged by when each will have the best market impact, and when each is delivered, exercised at o2a (release for work) and o16 (turn a toggle on). The How owner owns the SDLC. Demand is of three kinds (Round 22): new demand, a need not yet in the What, goes through the option pool and is ordered by the When owner; owed demand, where the software does not meet the What in force, and own-ground demand, work on the How owner's own ground (technical debt, the arrangement, dependencies, platform), enter the SDLC directly, ordered by the How owner and answered for by the DORA keys. The What owner classifies a reported defect as owed or new. Telemetry of the product in use is the How owner's to add and crosses How → What as read-only ground; all other evidence of the product in use is the What owner's own ground, to gather (Round 16). The What-locus share of o6 directions is the meter of the What's completeness (Round 18). Responsibility is placed per decision, not per role: for each boundary decision exactly one owner holds the act, with control and liability, and another owner's verdict enters only as read-only ground; a dispute escalates to the genesis grant holder. Each owner controls its own ground, and the seams supply ground to each, read-only for the receiver. The What owner's ready-for-users verdict, between o13 and o16, covers the software and the user-side share, and turning on a toggle without it is refused. The PDLC is a pull system for new demand: new work moves only when the When owner pulls an option from the option pool (Rounds 11, 22). Any owner may propose an option (o0), and the When owner is the biggest contributor. An option enters as an outcome or need, never as a What change; the What owner turns a pulled option into What decisions at o1. Every option leaves the pool by a recorded When-owner decision: pulled (o2a), declined with a reason, or expired when its market window passed. Priority is a When decision, never the What owner's. One person may hold both the What and the When scopes, with each act recorded under its own scope; with no second party, the genesis grant holder reviews. Delivery does not decide when: the How owner's duty is the shortest lead time within the What (ground and tolerance) and the product assurance, and the forecast is computed from the SDLC's record (Rounds 6, 19). The forecast's interval is flow time: from o2b (allocate the occupant) to o13 (deploy, dark), for new demand, based on the Kanban cycle time with o2b and o13 as its started and finished points, and distinct from DORA's change lead time (Round 27). Lowered verification is guarded by outcomes read across seams: it shows as change failure rate and failed ready-for-users verdicts, which the How owner answers for; if lowering implementation assurance moves neither, the verification removed gave no value (Rounds 19, 20). An issue declares its locus, the DDD-frame-01 coordinate the change moves: What (acceptance relation, tolerance), How (arrangement), ground or assurance, where an assurance-locus issue changes product assurance and an implementation-assurance change is How-locus (Round 19); planning moves no coordinate and is not a locus. This adds to DDD-dec-42 and supersedes nothing: the What stays in applications/sdlc/, owned in the PDLC and read by the SDLC as ground. It is not the Product Framework's Delivery revived: it carries no releases, versions or timeline as artefacts.
principal: Emil
made: |
  2026-11-06 and 2026-11-07, Rounds 3 to 22 and 27 of the conversation that chartered the SDLC and PDLC session, given by Emil in the claude.ai conversation (the question dialog where noted) and recorded verbatim at meta/sessions/2026-11-07-sdlc-and-pdlc/rulings.md; Claude's readings in Rounds 3, 5, 7, 9, 10, 11, 12 and 13 were approved by Round 14 ("All your readings are approved"); Rounds 16 to 22 were given after the first session's charter was cut and entered by amendment in place before landing (Round 21, "Amend before landing (Recommended)"); Emil's landing of the branch is the ratification act
resolution: |
  ## The rulings this decision carries

  Quoted from rulings.md, which holds them in full.

  - **The premise (Round 8).** "The primary issue is that we are working in the SDLC and this is
    describing the PDLC - so we need to change the premise." The PDLC lives at
    "applications/pdlc/ (Recommended)". The What "Stays, read as ground (Recommended)". Both
    applications are written in one session.
  - **The SDLC within the PDLC (Round 9).** "And the SDLC is a subprocess under the PDLC." Ruled
    reading (Round 14): the SDLC is a composite act within the PDLC, and every SDLC
    occurrence's layer path begins PDLC ▸ SDLC. This is a relation in the act map, not a
    directory layout.
  - **The name (Round 15).** "It is the SDLC so its the same arrangement." The PDLC's main
    document is the PDLC.
  - **The loci (Round 4).** "Yes, four values (Recommended)": What (acceptance, tolerance) ·
    How (arrangement) · ground · assurance. Planning stays outside as a non-coordinate.
  - **The issue declares its locus (Round 3).** "Yes, declared on the issue (Recommended)". The
    dispatcher refuses an issue without one.
  - **The issue separates the work from its occupant (Round 3, ruled reading).** Realisation
    planning (o1b) is inside the How locus. It is not the when-and-order planning, which is
    "Outside, but recorded (Recommended)" (Round 3).
  - **How and When (Round 5).** "the owner of the how also owns the process of getting changes to
    production … the process of ordering all the proposed changes and in what order and when
    they should be delivered is in the hands of the owner of the when." Release toggles: "Release
    toggles (Recommended)".
  - **The stance (Round 6).** "its the how owners responsibility to have approved work go
    production as fast as possible within the quality constraints." Assurance: "What owner
    (Recommended)".
  - **Why the What owner holds assurance (Round 7).** "for a product we can do multiple things to
    ensure success. One is on the implementation and the other is training your users." Ruled
    reading (Round 14): only the What owner sees the whole demand, so it sets assurance and
    chooses the mix between the software and the users.
  - **The placement rule (Round 10).** "Adopt it (Recommended)". The When owner as go-to-market:
    "I see when as the goto market so they know when a given feature will have the best impact".
    Ready for users: "Yes, as a constraint (Recommended)".
  - **The pull and the option pool (Round 11).** "the when as the business to decide. And is where
    the pull actual is. The when should also be the biggest contributor to the option pool."
    Options: "Yes, outcomes only (Recommended)". Exits: "Yes, recorded (Recommended)".
  - **Priority (Round 12).** "this also solves the classic problem of a product owner, owning the
    priority which is inherently wrong. That's a when decision". One person may hold both:
    "Yes, acts kept apart (Recommended)".
  - **Ground (Round 14).** "Ground is pr what how and when . Their ground is their own to control,
    but the seams between them supplies some to each".
  - **Evidence in use (Round 16).** "I agree the telemetry is the hows to add and the rest is the
    what to gather."
  - **Observation needs (Round 17).** "what people needs to add their observability needs to the
    specification so its clear where in the product they get their data and what data they need".
  - **The What owner's output (Round 18).** "its more than the needs it's everything the how needs
    in order to implement including the assurance". Assurance: "In the What, located
    (Recommended)". The meter: "Yes (Recommended)".
  - **Two assurances (Round 19).** "Assurance is the feature so its how sure can we be that our
    users does the act we designed. Not how sure are we the feature is implemented correctly that
    is the Assurance that the how must own". The guard: "Outcomes, read across seams
    (Recommended)".
  - **No value lost (Round 20).** "And if they don't thats fine - then it was properly not giving
    any value. And the DORA metrics are what the How needs in order to prove that it is doing its
    job".
  - **Amend before landing (Round 21).** "Amend before landing (Recommended)".
  - **Three kinds of demand (Round 22).** "determination pull will come from different sources".
    Kinds: "Adopt (Recommended)". The classifier: "What owner (Recommended)".

  ## P-1. The PDLC and its owners

  - **Three scopes.** The What, When and How owners are scopes under the product's genesis grant
    (applications/sdlc/authority.md §2–3; DDD-dec-87, DDD-dec-85). Each is held by a grant. The
    genesis holder may hold any of them.
  - **The What owner (amended, Rounds 18, 19).** It holds the What: everything the How needs in
    order to implement (P-10). That includes the acceptance relation and tolerance, and product
    assurance on the use act (P-11). It chooses how much of the product's acceptance is met by the
    software and how much by its users (training, guidance, procedure). "The What owner" may be
    several holders, one per scope (applications/sdlc/what.md §5.1).
  - **The When owner (amended, Round 22).** It is the business, where new demand enters, and the
    go-to-market owner. It holds the order of all new demand (o2a), and when each change reaches
    users (o16).
  - **The How owner (amended, Rounds 19, 22).** It holds:
    - the SDLC, the arrangement from a released issue to production, dark behind a toggle
      (DDD-dec-115);
    - implementation assurance on its acts (P-11);
    - the order of owed and own-ground demand (P-13).

  ## P-2. The placement rule

  - **Per decision.** For each boundary decision, exactly one owner holds the act, with control
    and liability. Another owner's verdict enters it only as read-only ground. The argument is
    core/05 §5: answerability, liability and control are separable, and liability without control
    is unfair and ineffective.
  - **The placement.**
    - What the product must do, its acceptance and tolerance: the What owner.
    - Product assurance, and the mix between software and users: the What owner (Round 19).
    - Implementation assurance: the How owner. It reads the What and the product assurance
      (Round 19).
    - Owed or new, for a reported defect: the What owner. It reads the report and the What in
      force (Round 22).
    - The order of owed and own-ground demand: the How owner. It reads the classification verdict
      and its own record (Round 22).
    - Ready for users: the What owner. It reads the change in production, dark, with its
      verdicts.
    - The order of all new demand (o2a): the When owner (Round 22). It reads the What elements, their
      declared acceptance, and the cadence.
    - Turning a change on (o16): the When owner. It reads the ready-for-users verdict.
    - A date promised outside: the When owner, outside the arrangement. It reads the forecast.
    - Cutting scope to meet a date: a What-locus decision of the What owner. It reads the When
      owner's proposal.
  - **The three rules.**
    1. The When owner may propose a What change but never make one.
    2. The What owner declares readiness but never picks the date.
    3. A dispute escalates to the genesis grant holder, since escalation routes a determination
       to an accountability-bearing actor (core/05 §5).
  - **Relative importance.** The What owner declares each element's outcome and acceptance. The
    When owner judges importance by when a feature will have the best market impact.
  - **Falsifier.** A boundary decision that cannot be split into one owner's act and another
    owner's ground. It is then jointly owned and belongs to the genesis grant holder, and the rule
    has failed for it.

  ## P-3. Ground

  Each owner controls its own ground. Where ground crosses a seam, its producer supplies it and
  the receiver reads it, read-only. A ground-locus issue declares whose ground it changes, and that
  owner accepts it. Round 14's listing of seam-supplied ground is checked against the act map in
  applications/pdlc/pdlc.md. It is not ruled here.

  ## P-4. Ready for users, and toggles

  - **The act.** Ready for users is the What owner's verdict, between o13 and o16. Product
    acceptance is met, by the software's share and the user-side share together.
  - **The constraint.** o16 reads that verdict. Turning on a toggle with no ready-for-users verdict
    is refused.
  - **Who holds the toggle.** Creating a toggle and retiring it are the How owner's, inside the
    SDLC. Turning it on is the When owner's.

  ## P-5. The pull system and the option pool

  - **The pull (amended, Round 22).** New work moves only when the When owner pulls an option
    (o2a). The SDLC never pushes new demand. Its cadence flows back as the forecast. Owed and
    own-ground demand do not go through the pool (P-13).
  - **o0, propose an option.** Any owner may occupy it, and the When owner is the biggest
    contributor. The What owner contributes specification gaps and user feedback. Round 11's
    reading had the How owner contribute arrangement changes and technical debt. Under Round 22
    those are own-ground demand and bypass the pool. The How owner contributes to the pool only
    the new demand it detects.
  - **What an option is.** An option is an outcome or need (who cannot do what, by when it
    matters), never a What change. The What owner turns a pulled option into What decisions at
    o1.
  - **How an option leaves.** Every option leaves the pool by a recorded When-owner decision:
    pulled (o2a), declined with a reason, or expired when its market window passed. There is no
    silent backlog, and option age and contributor share come from the record.

  ## P-6. Priority is a When decision

  - **The decision.** Priority is importance relative to the queue and the market window. That is
    ground only the When owner holds, so priority is the When owner's decision and never the What
    owner's.
  - **One person, two scopes.** One person may hold both the What and the When scopes. Each act is
    recorded under its own scope, so a When decision stays visible as one. With no second party to
    dispute, the genesis grant holder reviews.

  ## P-7. The stance

  Delivery does not decide when. The How owner's duty is the shortest lead time within the What
  (ground and tolerance) and the product assurance (amended, Round 19: these are "the quality
  constraints" of Round 6). The cadence that results is the forecast everyone else plans
  against. A forecast is computed from the SDLC's record, never promised by it.

  ## P-8. The locus

  - **The definition.** An issue declares its locus: the DDD-frame-01 coordinate the change
    moves. The four values:
    - What: the acceptance relation and tolerance.
    - How: the arrangement, How decisions and the code realising them, as one locus.
    - Ground.
    - Assurance: an assurance-locus issue changes **product** assurance. A change to
      implementation assurance is How-locus (Round 19).
  - **One layer up.** A change to the arrangement of the work itself is How one layer up, told
    apart by its layer path.
  - **Planning is not a locus.** It moves no coordinate. Derived order comes from the causal index
    (DDD-address-01). Chosen order among causally independent occurrences is the When owner's
    decision recorded at o2a.

  ## P-10. The What owner's output (Round 18)

  - **What it is.** At o1 the What owner frames everything the How needs in order to implement:
    the full ground and tolerance for the How's acts (applications/sdlc/what.md §1.1). That covers
    what.md §3.0 to §3.7, §4.1 and §4.2, together with the observation needs (P-12) and the
    product-assurance declaration (P-11). The PDLC spec tables them.
  - **The meter.** The What-locus share of o6 directions is the PDLC's meter of whether the What
    gave the How everything it needed. It is read from the SDLC's record across the How → What
    seam (Round 18).

  ## P-11. Two assurances (Round 19)

  - **Two acts, two assurances.** Assurance is a coordinate of each act's DDD-frame-01 tuple, so
    there are two, on two different acts.
  - **Product assurance.** It sits on the use act, occupied by users and software: how sure we
    can be that users do the act we designed. It is the What owner's. It is met by the software
    and the user-side share (Round 7), evidenced by observation needs and evidence in use
    (Rounds 16, 17), and judged at ready-for-users. It lives in the What as a located
    declaration (Round 18: "In the What, located").
  - **Implementation assurance.** It sits on the How's acts (build, accept, land): how sure we
    are that the feature is implemented correctly against the What. It is the How owner's. It is
    met by mechanical checks (o9), o10's depth, and the independence of acceptance (Round 13).
  - **Corrections.** This corrects Round 18's option text, whose "mechanical checks, o10 depth,
    independence" is implementation assurance. It refines Round 6: "the quality constraints" the
    How works within are the What and the product assurance.
  - **The guard (Rounds 19, 20).** Outcomes are read across seams:
    - lowered verification shows as change failure rate and failed ready-for-users verdicts, both
      in the record the What and When owners read, and the How owner answers for them;
    - if lowering implementation assurance moves neither, the verification removed gave no value,
      and the How owner may keep tuning it down until the outcomes move;
    - the DORA keys are the How owner's proof that it is doing its job, its answerability in
      core/05 §5's sense.

  ## P-12. Evidence in use and observation needs (Rounds 16, 17)

  - **Telemetry is the How owner's to add.** Telemetry of the product in use crosses the
    How → What seam as read-only ground, beside the change in production. The seam table gains
    that row.
  - **All other evidence is the What owner's own ground,** to gather: user research, support
    signals, training outcomes.
  - **The What owner adds its observability needs to the specification:** where in the product
    the data comes from, and what data is needed (Round 17). Their form, an observation need as a
    located What element, is proposed in the PDLC spec. It changes the What's schema, and goes by
    its own decision.

  ## P-13. Three kinds of demand (Round 22)

  - **New demand.** A need not yet in the What. It goes through the option pool, is ordered by
    the When owner (o2a) and is framed by the What owner (o1).
  - **Owed demand.** A decision already in the What that the software does not meet: the demand
    was allocated, but at the act nobody decided it (an escape). It enters the SDLC directly, is
    ordered and restored by the How owner, and is measured as time to restore.
  - **Own-ground demand.** Work on the How owner's own ground: technical debt, the arrangement,
    dependencies, platform. It enters the SDLC directly, is ordered by the How owner, and is
    justified by the DORA keys.
  - **What the When owner sees.** It sees owed and own-ground work only as its effect on cadence.
  - **The classification.** The What owner classifies a reported defect as owed (the software
    breaks the What in force) or new (the What must change). Only the What owner holds the What
    in force. The classification is its verdict, read by the How and When owners.
  - **The guard is Round 20's, from both sides.**
    - Too little own-ground work shows as rising change failure rate, lead time and time to
      restore.
    - Too much shows as falling cadence with no DORA improvement.
  - **Round 5, refined.** "Ordering all the proposed changes" now reads: the When owner orders
    all new demand.

  ## P-14. Flow time (Round 27)

  - **The ruling.** "And flow-time is the kanban time", then: "great - "flow-time" is approved and
    we use is as described and we write in the decision that it is based on the kanban cycle
    time".
  - **The definition.** Flow time is the forecast's interval. It runs from o2b, allocate the
    occupant, to o13, deploy to production, dark, for new demand. The forecast reads an issue's
    expected landing as roughly now + k/λ + median(flow time), resampled from the record
    (applications/pdlc/pdlc.md §1).
  - **Based on the Kanban cycle time.** The Kanban Guide (v2025.5, May 2025,
    kanbanguides.org/english/, read 2026-11-09):
    - It defines cycle time as "The elapsed time between when a work item started and when a work
      item finished."
    - It leaves those points to each Kanban system: "started and finished refer to how the Kanban
      system members have established those points in their DoW".
    - It names this alternative itself: "Cycle Time could be Flow Time".
  - **This PDLC's started and finished points** are o2b and o13. Its throughput is new-demand
    changes reaching o13 per unit of time, as the guide's "The number of work items finished per
    unit of time."
  - **Two differences from a board that ends at delivery and counts every item**, stated so the
    name is not misread:
    1. Finished is landed dark (o13), not delivered. Delivery is o16, the When owner's own act.
    2. Only new demand is counted. Owed and own-ground work share the How owner's capacity, and
       show in the forecast only as a lower throughput for new demand (Round 22).
  - **Not DORA's lead time.** DORA's change lead time runs from the first commit (o4) to o13, for
    every change, and is the How owner's answerability (Round 20; applications/sdlc/sdlc.md §18).

  ## P-9. Relation to DDD-dec-42

  - **Adds, supersedes nothing.** The What stays in applications/sdlc/, where DDD-dec-42 placed
    it. It is owned in the PDLC and read by the SDLC as ground. Every change of the What is still
    made by a decision anchored to a What element (DDD-dec-42 O-5).
  - **Not Delivery revived.** This is not the Product Framework's Delivery revived (retired by
    DDD-dec-42 O-2). It carries no releases, versions or timeline as artefacts. Ordering and
    delivery are recorded decisions, and forecasts are computed from the record.
