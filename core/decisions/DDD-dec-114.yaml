notes: |
  Id. Checked on every branch of both repositories at arrival on 2026-11-07. The highest held
  downstream was DDD-dec-113 and upstream DDD-dec-39, so this decision takes DDD-dec-114
  (bootstrap.md).

  Basis route. DDD-frame-01, DDD-frame-02 and DDD-ground-06 are upstream and already pinned at
  v5.15.2 in graph/upstream.yaml, so no pin is added. The prompt named DDD-address-01 as an
  upstream claim to pin. It is this repository's own claim (core/claims/DDD-address-01.yaml), so
  it resolves locally and is not pinned (bootstrap.md, arrival finding A-1).

  Ruled readings. The readings of Rounds 3, 5, 7, 9, 10, 11, 12 and 13 were recorded as
  UNVERIFIED — Emil review when given, and Round 14 approves them all. This decision states them
  as ruled. Round 6's wording of the stance was also flagged for review. Round 14's "all your
  readings" is read as covering it, and the charter carries the stance as ruled. That reading is
  Claude's, UNVERIFIED — Emil review, and it is recorded in rulings.md.

  Not ruled here, and Claude's (UNVERIFIED — Emil review):
  - The coordinate "task" of DDD-frame-01's tuple is not one of the four locus values. Claude
    reads it as what the issue itself names: a change of task is a new option, not a locus of an
    existing issue.
  - The ready-for-users verdict is read as a What-locus act that writes no What element. It
    records a verdict over production ground and the user-side share, and is computed, not stored
    (DDD-dec-49, DDD-dec-52): what is recorded is the declaration and the ground reading.
  - The When owner's acts (o2a, o16, an option's exit) are recorded as decisions under the When
    scope, signed like any acceptance under authority.md §4.1. Whether they need their own record
    kinds in the authority profile is a successor item.

  Canon names no owner roles. The three owners are this projection's, mapped to method step 7
  (complete accountability), which is [PROPOSED]. The specs (applications/pdlc/pdlc.md) carry
  the mapping as [PROPOSED].

  Amended in place on 2026-11-07, before landing (Round 21: "Amend before landing
  (Recommended)"), from Rounds 16 to 22 given after the first session's charter was cut
  (meta/sessions/2026-11-07-sdlc-and-pdlc/prompt-2.md). Each change names its round. The first
  version is at d52b93f.
  - Statement: the What owner's output and product assurance (Rounds 17, 18, 19); implementation
    assurance (Round 19); new demand ordered by When (Round 22); the three kinds of demand (Round
    22); evidence in use (Round 16); the meter (Round 18); the pull limited to new demand (Round
    22); the stance's constraint and the guard (Rounds 19, 20); the assurance locus (Round 19).
  - Resolution: the rulings list; P-1, P-2, P-5, P-7 and P-8 amended; P-10 to P-13 added.
  - basedOn: DDD-dec-64 (the What's structure, which P-10 reads) and DDD-dec-70 (the telemetry
    contract pattern, H-9, which P-12's observation need uses; it supersedes DDD-dec-60).
  - Round 11's reading had the How owner contribute technical debt and arrangement changes to the
    option pool. Round 22, the later round, makes those own-ground demand, outside the pool. P-5
    says so.
  - Round 20 withdrew a falsifier Claude proposed in Round 19 ("implementation assurance falls,
    and neither measure moves"). It is not in this decision. The replacement, Claude's and
    [PROPOSED], is in applications/pdlc/pdlc.md.

  Amended in place again on 2026-11-09, before landing (Round 21's rule), by Round 27:
  - the statement gains the flow-time sentence;
  - P-14 is added, quoting the Kanban Guide v2025.5;
  - the made line names Round 27.

  The Kanban Guide is cited in the resolution, not in basedOn. It is an external source, not a
  graph node, so a basedOn entry for it would not resolve (DDD-dec-111).
