notes: |
  Id. DDD-dec-115 is the highest on any branch (claude/sdlc-pdlc-applications-0u6318, unlanded).
  116 and 117 were checked free on every branch of both repositories on 2026-11-08.

  Grain. F-5 (grants and roles) is DDD-dec-117, because it supersedes product-cli's [D1.11] and
  amends authority.md Appendix B; this decision rests on it for "a holder of a grant".

  Not ruled. W-1 to W-5 in rulings.md were withdrawn or corrected in the conversation. O-1 (whose
  What holds a ground-sourced context when the source belongs to no product) is DDD-dec-113's Q-C2
  and stays open; O-2 (whether owners come from the Decision-Driven Organisations grant map) is
  open.

  Readings — Claude, UNVERIFIED — Emil review: R-a to R-d in rulings.md. R-b reads M-3 ("the how
  must dictate") and M-4 ("product-cli must contain the full feasibility verdict") together through
  M-5: the How's actor decides, product-cli records.

  Review triggers. Each accepted proposal carried a falsifier; a firing is a review trigger:
  - F-1: the integration blockers of the first organisational case mostly do not trace to a
    missing decision by an owning unit.
  - F-2: features crossing a dependency the How judged loosely coupled show longer change lead time
    than features crossing none.
  - F-3: after the model is extended, implementers infer about as much, or specifications fail to
    land as often.
  - F-7: specifications vetted on carried-forward ground fail to land more often than freshly
    vetted ones.
  - F-9 and F-10: elements that passed the admission check fail to land because of their ground.
  - F-12: runtime permission refusals (403s from the integration) on fields the check marked
    permitted.

  Not applied here. what.md, the sdlc: ontology and shapes, how.md and product-definition.md are
  unchanged by this session; the application is in successor-items.md.
