notes: |
  Id. Checked across every branch of both repositories on 2026-11-02 at 12:58 UTC. Upstream
  holds up to DDD-dec-39; main up to DDD-dec-84, with DDD-dec-83 never used; the live
  authority-profile branch (claude/bold-franklin-i7b16g, e120251) holds DDD-dec-85 to
  DDD-dec-93. This session takes DDD-dec-100 onward and leaves DDD-dec-94 to 99 as headroom for
  that session (meta/sessions/2026-11-02-canon-cli/bootstrap.md). The headroom is Claude's
  choice, UNVERIFIED — Emil review.

  The "project instructions" the question cites are the claude.ai project's, not a file in this
  repository. In-repo, why.md names product-cli as the reference implementation of the authoring
  layer.

  Reading — Claude, UNVERIFIED — Emil review. A third tool family exists. Varve builds with
  DecisionDriven.Analyzers and DecisionDriven.Report (nuget.org, 0.1.0-preview.10), which read a
  C# repository's docs/decisions/ at compile time. The ruling does not place them. They are read
  here as a third case, a C# product's build applying the method, and so on ddd's side of the
  boundary, not canon's. canon does not reimplement them.
