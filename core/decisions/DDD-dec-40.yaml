  Not done, and why: S-5 (the Danish glossary rulings) is Emil's act and nothing here needs it;
  S-8 (decision pinning) is low priority by Emil's ruling at the landing session and this
  decision's basedOn DDD-dec-39 is, like DDD-dec-38's DDD-dec-37, an unpinned upstream decision;
