format: 1
id: DDD-dec-82
kind: decision
statement: |
  The method's version follows SemVer under this mapping. It stays below 1.0 until all ten steps are ruled. MINOR moves when a step card is added or a step's register moves, whether from proposed to ruled to reported or back to open. PATCH moves for editorial changes. After 1.0, MAJOR moves when a ruled step is superseded incompatibly. The first release under the scheme is v0.5.0, continuing the existing tags v0.1.0 to v0.4.0, and the 4.x CHANGELOG headings stay as history.
principal: Emil
made: |
  2026-11-02, Round 2 of the ready-to-try session, given by Emil through the question dialog in the claude.ai conversation and recorded verbatim at meta/sessions/2026-11-02-ready-to-try/rulings.md ("As proposed (Recommended)"), answering the G6 question; Emil's acceptance of the pull request is the ratification act
resolution: |
  ## The ruling

  > Q: "G6 — SemVer for the method: stay below 1.0 until all ten steps are ruled; MINOR when a
  > step card is added or its register moves (proposed → ruled → reported, or back to open);
  > PATCH for editorial changes; MAJOR after 1.0 when a ruled step is superseded incompatibly. The
  > first release continues the existing tags as v0.5.0, and the 4.x CHANGELOG headings stay as
  > history. Rule it?"
  >
  > A: "As proposed (Recommended)"

  ## The mapping

  | Change | Below 1.0 | From 1.0 |
  |---|---|---|
  | A ruled step superseded incompatibly | MINOR | MAJOR |
  | A step card added, or a step's register moves (proposed → ruled → reported, or back to open) | MINOR | MINOR |
  | Editorial (wording that changes no ruling, links, tooling) | PATCH | PATCH |

  1.0 is reached when all ten steps are ruled. A claim's status change or an upstream pin advance
  moves no number by itself (DDD-dec-75); it does so only through a step whose register it moves.

  ## The first release

  v0.5.0, continuing git tags v0.1.0 to v0.4.0. The CHANGELOG's 4.x headings are kept unedited as
  history of the earlier numbering. The release is cut on Emil's merge of its descriptor, under the
  release-head guard (upstream DDD-dec-39).
basedOn:
