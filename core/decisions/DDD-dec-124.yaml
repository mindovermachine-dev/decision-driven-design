notes: |
  Id. Checked on every branch of both repositories at arrival (10:21 UTC) and again before the
  proposals (2026-11-20): 67 branches downstream, 27 branches and 18 tags upstream. No
  DDD-dec-124 file exists anywhere. One stray mention is on main and five other branches:
  meta/sessions/2026-11-18-canon-lock-file/findings.md, line 313, question W-1 of #83's session,
  which offered DDD-dec-124 as the alternative id for the agent review waiver. That alternative
  was not taken: the waiver was filed as DDD-dec-123. The mention names no decision and reserves
  nothing. DDD-dec-121 is held by #74 and is not used.

  Canon check of P-3's step 3, asked by Emil at G1, against v5.15.2: nothing says otherwise.
  Two boundaries follow from canon and are written on the card, UNVERIFIED — Emil review. The
  axis that separates inside from outside is a ground axis, never the occupant (DDD-ground-06;
  term:act-address: "The occupant is not part of it"). Declaring a missing axis is a second
  declaration of axes, which makes a second map (DDD-address-07) superseding the first
  (DDD-ground-06's region), and a wider map that shares the act must split it too, or a limb of
  DDD-address-07's falsifier fires.

  Open, not ruled here: what evidence a ruling that moves a move from [PROPOSED] to ruled should
  rest on, now that nothing in the method waits on T2b (Emil's request at G1, for G2). Step 5's
  ordering problem (DDD-dec-122, K-2) is carried as field B-4's open point.

  Review trigger. The first case mapped with the four moves outside this repository's own data:
  whether group A finds the pull, and whether a junior engineer can follow the trace.
