notes: |
  Id. DDD-dec-117 is the highest decision on any branch of either repository at arrival
  (2026-11-09); upstream's highest is DDD-dec-39. DDD-dec-118 to -120 appear only as range
  mentions (bootstrap.md).

  Not ruled, open for Emil (meta/sessions/2026-11-08-demand-flow/successor-items.md):
  - N-1, the numbering: renumber steps 2-10 to 3-11, or keep a stable number such as 1b. Either
    way the rule "the version stays below 1.0 until all ten steps are ruled" (method/README.md,
    DDD-dec-82's statement) now counts eleven steps, and needs a ruling to say so.
  - P-1, promotion: the evidence needed to propose any DDD-flow claim upstream is a second
    process mapped with the step, whose declared kinds match the PDLC's or do not.
  - E-1, the two examples: the method's sustained example is Varve's HTTP slice (ruled
    2026-11-02); this step's is the PDLC (Round 23). How they relate is open.
  - The area name `flow` is proposed in bootstrap.md, not ruled.

  Readings — Claude, UNVERIFIED — Emil review: R-a and R-b in rulings.md; the oC tension in
  DDD-flow-03's notes (whether "detects" means first sighting or classification).

  Review trigger. A second process mapped with the step declares kinds that differ from the
  PDLC's: the starting point is then one process's set among several, and the card's framing of
  it is reviewed with the promotion item.
