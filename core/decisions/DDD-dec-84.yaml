  - DDD-dec-81
notes: |
  Id. DDD-dec-84 was checked free on every branch of both repositories on 2026-11-02. Upstream
  holds up to DDD-dec-39 and main up to DDD-dec-73; this branch holds DDD-dec-74 to DDD-dec-82.
  DDD-dec-83 is skipped on purpose. The authority-profile session's plan
  (claude/bold-franklin-i7b16g, 50b463b, 09:31 UTC) names DDD-dec-77 to DDD-dec-83 as provisional,
  read before this branch filed 77 to 82 at 09:30 UTC. Taking 84 avoids adding to that overlap.
  How to resolve the overlap is Emil's.

  Reading — Claude, UNVERIFIED — Emil review. "Before v0.5.0" is read as: the gate lands in this
  pull request, ahead of the v0.5.0 descriptor. The upstream validator is kept unchanged, so
  every basis id in a descriptor here must name a local claim or decision; upstream ids pinned in
  graph/upstream.yaml do not resolve as basis.
