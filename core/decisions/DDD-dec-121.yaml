notes: |
  Id. At filing (2026-11-11), DDD-dec-119 and DDD-dec-120 are held on the branch
  claude/zealous-ptolemy-3txf8k, and no branch holds a higher decision, so this takes DDD-dec-121.
  Re-checked across every origin branch before commit and before push (findings.md).

  Open, not ruled (findings.md): claude plugin validate is not in CI (F-5); where a practitioner's
  artefacts go in a repository that uses product-cli's .ddd/ graph (F-6); thinness holds for the
  skill's text, not for the model's memory (F-7); one eval run reported reading at the pin with no
  git call recorded, not reproduced (F-8).

  Amended before landing, in place, in Round 30 (2026-11-19, method-plugin rulings.md), on the
  Round 29 report (findings.md, R-1). The occasion was DDD-dec-122 (#84), which superseded step 1
  after v0.7.0 without adding a card or moving a register, so the MINOR-only re-pin trigger of the
  first filing would not have re-pinned the plugin. DDD-dec-122 is named here as the occasion. It
  is not a basis (Round 30, item 2).

  Amended before landing a second time, in place, in Rounds 33 and 34 (2026-11-24, method-plugin
  rulings.md), on the Round 32 report. The occasion was DDD-dec-124 (#89): the method became one
  live card, and the numbered step cards not live. DDD-dec-124 is named here as the occasion. It is
  not a basis, as Round 30 ruled for DDD-dec-122.

  Review trigger. A method release that changes a file the skill reads without re-pinning the
  plugin; or an eval in which the plugin fills a card from memory.
