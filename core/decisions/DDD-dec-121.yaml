format: 1
id: DDD-dec-121
kind: decision
statement: |
  The method is installable as a Claude Code plugin in this repository, ddd-method in the marketplace decision-driven-design (.claude-plugin/marketplace.json at the root, the plugin in plugins/ddd-method/), for anyone adopting the method. The plugin is thin: its one entry skill, /ddd-method:run, carries procedure and discipline only, and reads the method's front (method/README.md), its live card, the sections and files the live card cites, and the canon they cite, from this repository at one pinned method release, from a clone at the tag or otherwise over HTTPS at the tag; when neither is reachable it says so and stops, and never fills from memory. Per-step skills are not added. The plugin's version is the method pin it reads without its v (0.7.0 for v0.7.0); a plugin-only change at the same pin takes a +p.N suffix (0.7.0+p.1), and a re-pin takes the new pin's version (0.8.0 for v0.8.0). Any method release that changes a file the skill reads, anything under method/ or a claim or decision a card cites, re-pins the plugin in the same change, whatever part of the version it moves. The plugin claims discipline, not better execution of the method: it refuses to treat any part of the method as ruled, does not run a card marked not live, reads at the pin, and stops when it cannot; it does not claim that a move is performed better with it than without it. That claim rests on the plugin's evals run at its current pin, re-run at each re-pin.
principal: Emil
made: |
  2026-11-08, Round 27 of the claude.ai conversation (verbatim in meta/sessions/2026-11-08-method-plugin/prompt.md and rulings.md), and 2026-11-11, Round 28 of the same rulings.md, Emil's answers in Claude's question dialog on claude.ai, filed by the method-plugin session; amended before landing on 2026-11-19 by Rounds 29 and 30, and on 2026-11-24 by Rounds 32, 33 and 34, of the same rulings.md; Emil's landing of the branch is the ratification act
resolution: |
  ## Round 27 (claude.ai conversation, 2026-11-08)

  - **Ruled: who installs it, and from where.** "From the repo, for practitioners
    (Recommended)" (option text: "A Claude Code plugin in decision-driven-design (a skill plus
    marketplace entry), installable by anyone adopting the method; versioned with the method").
  - **Ruled: scope.** "The whole method (Recommended)" (option text: "All steps, each run from its
    step card; refuses to treat [PROPOSED] steps as ruled; step 1 and the demand-flow step first
    in practice"). **Lapsed:** "step 1 and the demand-flow step first" lapses under DDD-dec-124,
    since neither step is live (Round 34, amendment 4 of the Round 32 report). The ruling stays
    here verbatim.
  - **Ruled: holding.** "Thin, reads the repo at a pin (Recommended)" (option text: "The skill
    carries procedure and discipline; step cards and canon are fetched from the repository at the
    pinned version, so it never drifts").

  ## Round 28 (2026-11-11, method-plugin rulings.md)

  - **F-1: design and build accepted together.** "Accept both (Recommended)" (option text: "Design
    and build are separate commits and the design matches the charter; record the missed gate as
    a finding").
  - **F-3: the version scheme.** "Yes (Recommended)" (option text: "0.7.0 now; 0.7.0+p.1 for a
    plugin fix; 0.8.0 when it re-pins to v0.8.0. Claude Code updates on any version-string
    change").
  - **F-4: filed.** "File it (Recommended)" (option text: "Thin skill reading at a pin, one entry
    skill, the version scheme, and the README claiming discipline rather than step quality").
  - **F-9: the README's opening line** names the current release; the pull request is Emil's to
    open.

  ## Round 29 (2026-11-19, method-plugin rulings.md)

  - **The hold.** "#74 is held. It does not land at v0.7.0." #84 changed step 1 after v0.7.0, and
    the plugin reads the step cards at v0.7.0. Landing it then would ship a plugin that teaches a
    superseded step 1. When the release that carries #84 is tagged, the plugin re-pins to it, its
    evals are reworked and re-run, and the branch is rebased onto main.

  ## Round 30 (2026-11-19, method-plugin rulings.md)

  - **The release that carries #84 is v0.8.0**, MINOR under DDD-dec-82's first row (a ruled step
    superseded incompatibly). It is cut in its own session.
  - **This decision is amended in place** by amendments 1 to 4 of the Round 29 report: the re-pin
    trigger, evidence by pin, the carrying release, and these rounds. Amendment 5 (DDD-dec-122 in
    basedOn) is declined: #84 is the occasion, not the basis.

  ## Round 32 (2026-11-24, method-plugin rulings.md)

  - **The hold is lifted.** v0.8.0 is tagged on main at e57c5ee. DDD-dec-124 (#89) made the method
    one thing, making an act map, in four moves, each [PROPOSED], with one live card,
    method/make-an-act-map.md, and the numbered step cards each marked not live. The plugin
    re-pins to v0.8.0 and reads one card, not ten.

  ## Round 33 (2026-11-24, method-plugin rulings.md)

  - **The plugin's behaviour.** It offers the live method's moves at their registers; refuses to
    treat any part as ruled; does not run a card marked not live, and says where that card's
    content sits only as the live card at the pin says it, holding no such mapping itself; reads a
    not-live card's section only where the live card cites it, and says so; and does not offer a
    page that runs a not-live card.
  - **This decision is amended in place** by amendments 1 to 3 and 5 to 7 of the Round 32 report
    (numbered as in that report's chat reply). Amendment 4, a reading that Round 27's "step 1 and
    the demand-flow step first" lapses under DDD-dec-124, is not answered in Round 33; Round 34
    answers it.
  - **The pin-tree check**, derived from what the skill reads (Round 31, item 4, as Round 33
    rules).

  ## Round 34 (2026-11-24, method-plugin rulings.md)

  - **Amendment 4: yes.** Round 27's "step 1 and the demand-flow step first" stays verbatim, with
    a note that it lapses under DDD-dec-124, since neither step is live.
  - **A not-live card's superseding section may be read.** The skill reads a not-live card's first
    line and its superseding section, the part DDD-dec-124 filed above the rule line. It never
    reads or runs what lies below that line, except a section the live card cites. This supersedes
    Round 33's narrower rule and the first-line narrowing made for it. The live card is not
    changed.

  ## What the plugin claims, and the evidence

  Discipline, not step quality. From the eval table in
  meta/sessions/2026-11-08-method-plugin/findings.md, **at the pin v0.7.0** (3 runs per arm, with
  and without the plugin): step 1 on a small example shows no gain, 0.81 to 0.95 with the plugin and 0.86 to 0.90
  without. The gain is in discipline: a [PROPOSED] step asked as ruled, 1.00 with and 0.75 without;
  the repository unreachable, 1.00 with and 0.33 without (without the plugin, 2 of 3 runs rebuilt
  step 1's card from memory); demand flow offered from the PDLC's kinds as a start, 1.00 with and
  0.75 without. **At the pin v0.8.0** (the live card, four moves; the evals cover moves 1 to 3, and
  move 4 and the edge pass are not tested): an act map on a small example, 0.85
  with and 0.56 without, on judged fields that are noisy on long files, where the plugin leaves
  unknown fields empty rather than guess. The gain is again in
  discipline: a [PROPOSED] move asked as ruled, 1.00 with and 0.75 without; the repository
  unreachable, 1.00 with and 0.44 without (without the plugin, 2 of 3 runs rebuilt the method from
  memory); a not-live card asked to run, 0.94 with and 0.44 without. The last two are the re-run after
  Round 34 (earlier: 0.81 / 0.63 and 1.00 / 0.50, findings.md). These are evals of an agent on cases written inside the framework: exercised
  evidence about the plugin's behaviour, none about the method. The claim stands on the evals at
  the plugin's current pin. They are re-run at each re-pin, and each pin's table is kept in the
  record, never overwritten.

  ## What is filed

  - `.claude-plugin/marketplace.json`; `plugins/ddd-method/` (plugin.json at 0.8.0, the skill
    `run` pinned at v0.8.0, README.md, check.py, pin_trees.py, evals/).
  - `plugins/ddd-method/check.py` as the `plugin` gate of scripts/ci.py: the marketplace entry and
    the manifest agree, the version tracks the pin, the evals and both READMEs name only the pin,
    and the skill holds no claim or decision id and no run of eight words shared with method/.
  - `plugins/ddd-method/pin_trees.py` and `evals/pin-trees.json`: the files the skill reads at the
    pin, derived from the method's front and its live card, each with its git object id at the
    commit the evals ran on. check.py derives them again at the pin and fails on any difference.

  ## Relation to earlier decisions

  - **Release.** The plugin pins the newest method release when it lands. Any method release that
    changes a file the skill reads (anything under method/, or a claim or decision a card cites)
    re-pins the plugin in the same change, whatever part of the version it moves. No release is cut
    by this decision.
  - **Name.** The plugin is ddd-method, not ddd, which is product-cli's tool for product
    repositories (DDD-dec-100).
  - **Supersedes nothing.**
