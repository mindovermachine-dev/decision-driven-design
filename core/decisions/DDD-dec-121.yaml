notes: |
  Id. At filing (2026-11-11), DDD-dec-119 and DDD-dec-120 are held on the branch
  claude/zealous-ptolemy-3txf8k, and no branch holds a higher decision, so this takes DDD-dec-121.
  Re-checked across every origin branch before commit and before push (findings.md).

  Open, not ruled (findings.md): claude plugin validate is not in CI (F-5); where a practitioner's
  artefacts go in a repository that uses product-cli's .ddd/ graph (F-6); thinness holds for the
  skill's text, not for the model's memory (F-7); one eval run reported reading at the pin with no
  git call recorded, not reproduced (F-8).

  Review trigger. A method release that moves a register or adds a card without re-pinning the
  plugin; or an eval in which the plugin fills a card from memory.
