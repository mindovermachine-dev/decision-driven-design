notes: |
  Id. DDD-dec-112 is on main (the canon CLI session). 113 was checked free on every branch on
  2026-11-06, and Emil named it in the ruling.

  Readings — Claude, UNVERIFIED — Emil review. They are recorded with the rulings (R-a to R-c) and
  applied as stated.
  - R-a. "Existing violations are not demoted" is read as governing the clause and E-7's System
    purpose. The seven charted shapes move to Warning by "the principle as proposed".
  - R-b. E-8's new cardinalities enter as Warnings under the clause (mapsFrom at most once;
    exactly one mapsTo with mapsFrom), with "direction undeclared". The existing violation, "a
    context mapping connects two concepts", is kept and counted over mapsFrom and mapsTo together,
    so that the directed form is admitted.
  - R-c. E-4's five shapes were proposed at Warning, so the clause agrees.

  Evidence. The regime table of #49 §1 and #50's results reproduce in this repository with
  pyshacl 0.40.2 at c7424ad's ontology and shapes (Round 1). Varve's results are reported in #49
  and were not re-run here.
