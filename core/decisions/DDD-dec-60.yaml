format: 1
id: DDD-dec-60
kind: decision
statement: |
  The gate relies only on facts recorded with provenance, from Writ's closed provenance set, to which deployment is added. A fact no reporter could supply is a reported gap. A verdict that would need it is an open question, with the absent reporter as one candidate (G8). It is never 'unknown': Writ's verdicts are clean, violation and open question, and an open question can block.
principal: Emil
made: 2026-10-28, on the Product Framework How session's proposal (applications/sdlc/how.md at 88bf686, filed as a proposal on 2026-10-27); ruled in one message, recorded verbatim as Round 1 of meta/sessions/2026-10-27-product-framework-how/rulings.md; Emil's acceptance of the pull request is the ratification act, after the move's identity form lands and the supersessions of ruling 4 are written
resolution: |
  ## Ruled, 2026-10-28 (repair 4, corrected)

  > Missing reporter → "unknown": corrected. Writ's G7 says `explain` never says unknown, and its
  > verdicts are three: clean, violation, open question. A fact no reporter could supply is a
  > reported gap, and a verdict that would need it is an open question with the absent reporter
  > as one candidate (G8).

  Writ's reporter contract is an existing definition: Writ product definition Draft 2, as Emil
  states it. A Projector takes a repository at a commit, or a reporter input with its hash. There
  is a reports partition per reporter. Provenance comes from the closed set file, compiler, graph,
  runner, data, telemetry, attestation. Emil adds deployment to that set as a Writ definition change
  on 2026-10-28. This answers how.md D-2. It also answers the runner (H-14) and the Kind-1 telemetry
  wiring, which have provenance values already.

  ## Recorded at filing — Claude, UNVERIFIED — Emil review

  Claude has not read Draft 2: Hafeok/writ is at Draft 1 (3b1c5af, re-fetched 2026-10-28). The How
  keeps its distinction between a unit's declaration and the running unit, so that drift can be
  seen. The distinction is not a provenance value. It is which reporter input the reading came
  from: the declaration at a commit, or an inventory snapshot. Writ hashes the input either way, and
  both readings have provenance deployment.

  ## Not ruled separately; stands as proposed until the merge

  Declared readings may gate land and observed readings do not; Kind-1 measurement wiring is held
  as a contract; a freshness bound per contract.

  ## Provisional anchoring — the supersession obligation (ruling 4, 2026-10-28)

  > Decisions written before the identity form is fixed — accepted, provisionally. They live in
  > the test product only; they are not acceptable into any real product; and when the What lands
  > with its identity form, each is superseded by a version against the real identifiers, never
  > edited.

  Bound by it: every record in applications/sdlc/how-examples/ that anchors to a What element or
  names one (the target declarations, the imports, the acceptance), and the provisional What graph
  there. None may be imported, landed or accepted into any real product. When the What lands with
  its identity form, each is superseded by a new version against the real identifiers. No record
  is edited. This decision's own uses of provisional What kind names and identifiers are
  superseded the same way.
