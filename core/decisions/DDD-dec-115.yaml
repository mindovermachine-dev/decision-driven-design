notes: |
  Id. Checked on every branch of both repositories at arrival on 2026-11-07. This decision takes
  DDD-dec-115, the next above DDD-dec-114 (bootstrap.md).

  Basis route. DDD-dec-111 requires every basedOn entry to resolve. DDD-dec-112 pins upstream
  decisions as well as claims. The upstream ids here (DDD-frame-01, DDD-frame-02, DDD-ground-06)
  are already pinned at v5.15.2. DDD-address-01 is local (bootstrap.md, A-1). No pin is added.

  Varve read at 81fba3d, a shallow clone of its default branch at arrival. Findings that shape
  the spec, Claude's, UNVERIFIED — Emil review:
  - ADR 0066's title is "Expected-red pull requests". Its point 7, "A session never writes
    accepted-by", is the rule the prompt cites. The acceptance-authority gate itself is ADR 0087's
    rule 2 (eng/decision-sets.cs). Amended on 2026-11-06 by ADR 0239: the maintainer's
    on-machine delegate may write it.
  - In Varve an agent is identified by its commit author email (Identities.AgentByEmail), not by a
    trailer. This repository's port (DDD-dec-109) adds the Claude-Session trailer and the Claude
    app's id. The SDLC carries this repository's form, flagged as a departure from ADR 0087.
  - Varve's identities.json has no Approve field. The holders of Approve for an agent are its
    responsible human and that human's delegates (ActingFor).
  - Varve does not ignore edited approval comments. DDD-dec-109 rule 5 does. The SDLC carries the
    rule, flagged as a departure.
  - No Varve ADR has the gates App fast-forward main. In Varve the fast-forward is the
    maintainer's own push (ADR 0088). Round 1 rules that the gates App fast-forwards. That is new,
    and it is unexercised in both repositories.
  - ADR 0088's revisit condition concerns GitHub refusing a fast-forward of main to a commit whose
    checks passed on land/**. It is stated for a human's push, and Varve records no outcome. The
    App's fast-forward to a SHA checked on ready/** is a falsifier in the spec.

  takt read at 4e11a1b. Its development branches are issue-number branches ("[0-9]*") and
  copilot/*, not dev/**. The squash, the landing and the issue closing happen in
  devx-cafe/takt-actions and devx-cafe/gh-tt, which are not vendored there and were not read.
  Main deploys to stage in takt (on_main.yml). Production comes from a semver tag
  (on_semver.yml). Here main deploys to production (Round 2).

  Claude Code Action read from code.claude.com/docs/en/github-actions.md and the action's
  docs/security.md and docs/usage.md on 2026-11-07. What it says about label triggers,
  write-access checks, bots and comment filtering is in applications/sdlc/sdlc.md §12, quoted.
  It documents no per-run cost output. Edition 1's cost fields are read from the run's own record,
  or left unknown, never estimated (sdlc.md §13).

  Amended in place on 2026-11-07, before landing (Round 21), from Rounds 19, 20 and 22 given
  after the first session's charter was cut (prompt-2.md). The first version is at d52b93f.
  - Statement: the entry of owed and own-ground demand; implementation assurance; the DORA keys
    as answerability.
  - Round 13's assurance line now names implementation assurance (Round 19).
  - S-1's inputs amended.
  - S-8 to S-10 added.
  - No basedOn change: every new basis is DDD-dec-114, already listed.

  Amended in place again on 2026-11-09, before landing (Round 21's rule), by Round 28:
  - the statement gains a sentence;
  - S-11 is added;
  - the made line names Round 28;
  - the Varve findings above, first flagged UNVERIFIED, are ruled with R21.

  PROV is an external standard, cited in S-11, not listed in basedOn, since it is not a graph
  node (DDD-dec-111).
