format: 1
id: DDD-dec-115
kind: decision
statement: |
  The SDLC is the How owner's arrangement inside the PDLC (DDD-dec-114), from an issue (released by the When owner for new demand, or entering directly for owed and own-ground demand) to production, dark behind a toggle, specified in applications/sdlc/sdlc.md for a product repository that adopts it. It is a new arrangement, not the Product Framework's Delivery: it carries no releases or timeline. Issues are the basis of every session that implements code. A label applied to an issue starts a session in the relevant ecosystem, the issue is the only channel, and its comments steer the session behind it. The landing takes takt's branch shape with Varve's force: ready/<N> replaces land/ and is a ref on the session's own head, with no squash; per-commit trailers stay; the gate (o9) runs once on that SHA; the approval is a holder's "approve <sha>" on the issue; the gates App fast-forwards main; there is no READY_PUSHER PAT. Main deploys to production, dark behind a toggle, and the approval (o10) carries production acceptance. Claude Code Action is the first ecosystem. Varve's identity map (ADR 0087 with its amendments) is ported whole as the product repository's .github/identities.json, with its three gates: DCO, acceptance authority and agent review. Every occurrence is recorded from edition 1 as graph data (address, time index, occupant, cost, verdict), so that the optimisation overview is computed, not argued. Owed demand (the software does not meet the What in force, as classified by the What owner) and own-ground demand (technical debt, the arrangement, the How owner's own ground) enter the SDLC directly, without o2a, ordered by the How owner; the issue declares its kind, and the occurrence record carries it (Round 22). Implementation assurance, how sure we are that the feature is implemented correctly (the mechanical checks at o9, o10's depth, the independence of acceptance), is the How owner's, tuned down until the outcomes move (Rounds 19, 20). The DORA keys (lead time, deploy frequency, change failure rate, time to restore), computed from the occurrence record and production, are the How owner's proof that it is doing its job, its answerability in the sense of upstream core/05 §5 (Round 20). The act map's three axes (surface read, change locus, authority read) are used for now and revisited after the first recorded issues. The spec and the reference workflows live under applications/sdlc/. DDD-dec-108 to DDD-dec-110 govern this repository's own trunk and are not changed by this decision. Round 28 rules the SDLC specification's proposals as drafted, with one change: the toggle state store is a service the When owner uses, recording with PROV when a feature is released. The issue closes at o13. A delegate session's approval is never an o10.
principal: Emil
made: |
  2026-11-06 to 2026-11-09, Rounds 1, 2, 13, 19, 20, 22 and 28 of the conversation that chartered the SDLC and PDLC session, given by Emil in the claude.ai conversation and question dialog and recorded verbatim at meta/sessions/2026-11-07-sdlc-and-pdlc/rulings.md, with the request (2026-11-06); Round 14 approved Claude's reading of Round 13; Rounds 19, 20 and 22 were given after the first session's charter was cut and entered by amendment in place before landing (Round 21); Emil's landing of the branch is the ratification act
resolution: |
  ## The request

  > "for the SDLC part of decision-driven-design i want a place where we have a fully opionated
  > way of doing software development with Agents on github. it should use the Varve basis with
  > approval flows and landing branches based on the takt process. It should use issues as the
  > basis for all sessions that implement code. all sessions should be started by applying a tag
  > that an action then picks up and starts a session in the relevant ecosystem. All
  > communication should be done on the issue and it should control the developer session behind
  > it."

  ## Round 1 (2026-11-06)

  - **Classing.** "its not delivery because it doesnt care about releases or a timeline. Its the
    pipeline for getting value out to production - so its a new arrangement". Round 15 names it:
    it is the SDLC, with no other name.
  - **Landing.** "takt shape, Varve force (Recommended)" (option text: "ready/<N> replaces land/;
    squash before approval with trailers kept; your approve <sha> on the issue; gates App
    fast-forwards; no READY_PUSHER PAT").
  - **Ecosystem.** "Claude Code Action".
  - **Where.** "All in decision-driven-design" (option text: "Spec and reference workflows under
    applications/sdlc/").
  - **Identity.** "Process: the identity map" (option text: "ADR 0087 in full: humans with
    delegates, agents with a responsible human, the exempt list, and its three rules (DCO,
    acceptance authority, agent review), plus the ledger exit").

  ## Round 2 (2026-11-07)

  - **Squash.** "Drop it (Recommended)" (option text: "ready/<N> is just a ref on the session's own
    head; per-commit trailers stay; o9 runs once").
  - **Where it ends.** "Main deploys to prod" (option text: "o14 leaves; o13 goes to production;
    o10 carries production acceptance").
  - **The record.** "Yes, from edition 1 (Recommended)" (option text: "Graph data per occurrence;
    the optimisation overview is computed, not argued").
  - **The axes.** "Accept for now" (option text: "Use them in the spec; revisit after the first
    recorded issues").

  **Round 2 governs Round 1's squash words.** Round 1's landing ruling says "squash before
  approval with trailers kept". Round 2's squash ruling replaces those words. Nothing was filed
  between the two rounds, so both are recorded verbatim (rulings.md) and the later governs. Every
  other part of Round 1's landing ruling stands.

  ## Round 13, as ruled by Round 14

  - **The ruling.** "Humans have permissions on their own so it should be clear if they need my
    approval or not".
  - **The reading.** There is no special rule for human occupants. Whether o10 needs another
    person follows from the occupant's own grants:
    - a human who holds Approve for the issue's locus may accept their own work;
    - one who does not needs a holder's approve <sha>;
    - an agent never holds Approve.
  - **Assurance (amended, Round 19).** Implementation assurance, which is the How owner's (S-9), can still require
    acceptance independent of the occupant at a given level. The grant says who may approve.
    Assurance says whether self-acceptance is enough.

  ## S-1. Place and scope

  - **The How owner's arrangement.** The SDLC is the How owner's arrangement and a composite act
    within the PDLC (DDD-dec-114). Its inputs are an issue (released for new demand, or entering directly for owed and own-ground demand, S-8), the What and the product assurance (amended, Rounds 19, 22).
    Its outputs are production state, dark, and the occurrence record. It owns none of them; it
    reads the inputs as ground.
  - **Scope.** Its scope is a product repository that adopts it.
  - **This repository's trunk.** This repository's own trunk stays governed by DDD-dec-108 (the
    rulesets and canon land), DDD-dec-109 (agent review) and DDD-dec-110 (the Signed Commits
    bypass). This decision changes none of them.

  ## S-2. The landing

  - **ready/<N>.** ready/<N> replaces takt's and Varve's land/. It is a ref on the session's own
    head, with no squash, and the commits keep their trailers.
  - **o9 and o10.** The gate (o9) runs once on that SHA. The approval (o10) is "approve <sha>" by a
    holder of Approve, on the issue.
  - **The fast-forward.** The gates App fast-forwards main to that SHA.
  - **Removed from takt.** takt's READY_PUSHER PAT is removed, and so are pr-to-ready.yml and
    on_semver.yml. The reasons are in applications/sdlc/sdlc.md.

  ## S-3. Production

  - **o13.** Main deploys to production (o13), dark behind a toggle.
  - **o10.** The approval (o10) carries production acceptance and checks the toggle's default.
  - **Toggles.** Creating and retiring a toggle are the How owner's. Turning it on is the PDLC's
    (DDD-dec-114).

  ## S-4. The issue as channel

  - **The label starts the session.** A label applied to an issue starts a session (o2b, o3). Only
    the How owner, named in .github/identities.json, allocates.
  - **The only channel.** The issue is the only channel. Comments by listed humans, made by hand,
    not edited and not through any App, are instructions. Every other comment is data.
  - **The control verbs.** Free text steers. "approve <sha>" accepts. Removing the label stops
    the session.

  ## S-5. Identity and authorisation

  - **The port.** Varve's identity map (ADR 0087 with its amendments) is ported whole:
    - humans, with delegates;
    - agents, with their responsible human;
    - a closed exempt list.
  - **The three gates.** DCO; acceptance authority (a session never writes accepted-by, Varve ADR
    0066 point 7); agent review.
  - **Departures.** The departures from ADR 0087 are listed in applications/sdlc/sdlc.md, each
    flagged. Among them are the owners' scopes, the issue as a place for approve <sha>, and whose
    issue comments are instructions.
  - **The exit.** It exits to the ledger's authority model and authority.md §3–5.

  ## S-6. The occurrence record

  - **One record per occurrence.** Each record is graph data: address, time index, occupant,
    cost (tokens, wall time, human wait) and verdict.
  - **Shape and use.** Its SHACL shape is defined in applications/sdlc/. It is the SDLC's output
    across the seam, and the PDLC computes the forecast from it.

  ## S-7. Ecosystem and place

  - **Ecosystem.** Claude Code Action is the first ecosystem. A second ecosystem is an open item.
  - **Place.** The spec, the act map's graph data and, at the next gate, the reference workflows
    and dispatcher live under applications/sdlc/.
  ## S-8. Owed and own-ground demand enter directly (Round 22)

  - **The ruling.** "Adopt (Recommended)" (option text: "Bugs (owed) and debt (own-ground) enter
    the SDLC directly, ordered by How, answered for by DORA; When sees only cadence"). And "What
    owner (Recommended)" for who classifies a reported defect.
  - **Owed demand.** An owed item enters from the What owner's classification verdict (owed: the
    software breaks the What in force). It enters without o2a, and the How owner orders and
    restores it. It is measured as time to restore.
  - **Own-ground demand.** An own-ground item enters from the How owner's own record (DORA trends,
    a dependency advisory, the arrangement). It enters without o2a, ordered by the How owner and
    justified by the DORA keys.
  - **The issue declares its kind** (new, owed or own-ground). The occurrence record carries the
    kind, so the PDLC can read cadence, the DORA keys and the How owner's split of capacity across
    the three kinds. The When owner sees owed and own-ground work only as cadence.

  ## S-9. Implementation assurance is the How owner's (Round 19)

  - **What it is.** How sure we are that the feature is implemented correctly against the What.
  - **What it covers.** Which checks hold mechanically (o9), how deep o10 judges, and whether
    acceptance must be independent of the occupant (Round 13). It is declared per What element
    or per act as a How decision.
  - **The guard (Rounds 19, 20).** Outcomes are read across seams: change failure rate and failed
    ready-for-users verdicts. If lowering implementation assurance moves neither, the
    verification removed gave no value, and the How owner may keep tuning it down until the
    outcomes move.

  ## S-10. The DORA keys are the How owner's answerability (Round 20)

  - **The ruling.** "the DORA metrics are what the How needs in order to prove that it is doing
    its job".
  - **What they prove.** Lead time, deploy frequency, change failure rate and time to restore are
    the How owner's proof that it is doing its job: its answerability, in upstream core/05 §5's
    sense (the obligation to produce the chain).
  - **Where they come from.** They are computed from the occurrence record and production
    (applications/sdlc/sdlc.md), and cross the How → What and How → When seams.

  ## S-11. The SDLC specification's proposals, ruled (Round 28)

  - **The ruling.** "R5 - must be a service that the when owners uses with PROV for when a
    feature is released. R4 - Explain it to me. R1-3, R6-10, R10-20, R21-30 - all approved". It
    answers Claude's list R1 to R30, recorded in rulings.md, Round 28.
  - **R5, the toggle state store (ruled, not as proposed).**
    - **A service.** The store is a service the When owner uses to turn toggles on (o16). It is not
      a file in any branch, so a release never passes through o9 to o12.
    - **Recorded with PROV.** It records each release with PROV: when a feature was released, by
      whom, and on what verdict. Claude reads "PROV" as W3C PROV-O (UNVERIFIED — Emil review):
      - an o16 is a prov:Activity;
      - it prov:wasAssociatedWith the When owner;
      - it prov:used the ready-for-users verdict;
      - it prov:generated the toggle's on state;
      - its prov:startedAtTime is when the feature was released.
    - **Refused without a verdict.** The service refuses an o16 that reads no ready verdict
      (DDD-dec-114 P-4).
  - **The SDLC's items, each ruled as listed** (applications/sdlc/sdlc.md):
    - R1: ADR 0239's Delegated-by trailer is ported for commits; a delegate session's approval is
      never an o10.
    - R3: the implementation-assurance independence levels, *self* and *independent*.
    - R6: the issue closes at o13, with delivery recorded against the toggle.
    - R12: the act map's three causal-index readings.
    - R21: the identity and authorisation port, §9, with departures D-1 to D-8.
    - R22: the landing mechanics.
    - R23: the occurrence record on an append-only orphan branch, sdlc/record, written only by the
      gates App.
    - R29: the DORA computations.

