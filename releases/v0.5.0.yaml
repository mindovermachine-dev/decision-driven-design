title: 'Ready to try: the method as a preview, with step 1 ruled for test'
summary: |
  **The first release whose version is the method's** (`DDD-dec-75`, mapped by `DDD-dec-82`).
  Decision-Driven Design is presented as **ready to try, not ready to use** (`DDD-dec-74`): one of
  ten steps is ruled, and it is ruled for test.

  - **Step 1, map and index acts**, is ruled for test. Its claims are projected: `DDD-ground-06`
    and `DDD-ground-01` upstream, and `DDD-address-01` to `05` here. They wait on T2b, the first
    independent application case. Steps 2 to 10 are `[PROPOSED]`, and their cards carry only
    what is filed.
  - **A quick start** runs step 1 on the HTTP slice of Varve `v0.1.0-preview.15` (`DDD-dec-77`).
    Varve is the subject of design, not a dependency. The example is exposition, not evidence, and
    its falsifier, the junior-engineer test, has not been run.
  - **A practitioner README.** The theory moved, unchanged, to `why.md`.
  - **The stewardship standard**, adopted as it applies (`DDD-dec-76`, `DDD-dec-81`), with three
    stated departures in `GOVERNANCE.md` (`DDD-dec-78` and the signing exception). **Copyleft**:
    CC BY-SA 4.0 for text and MPL-2.0 for code (`DDD-dec-79`). `scripts/ci.py` runs every gate,
    inside a devcontainer. The **release-head guard** is ported (`DDD-dec-84`), and this release is
    its first instance here.

  Everything on `main` since `v0.4.0` ships with it, including the Product Framework What and How
  (`DDD-dec-41` to `DDD-dec-73`). Releases up to `v0.4.0` stay under CC BY 4.0 and Apache-2.0.
